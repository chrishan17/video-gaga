<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Same numbers, different lights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=block" rel="stylesheet">
</head>
<body>
<script src="build/narration.js"></script>
<script src="../../runtime/video-gaga.js"></script>
<script type="module">
// One pixel of an LCD, built as a bench instrument with the anatomy kit
// (github.com/wheresryan22/anatomy), and the two monitors it lives in.
// Numbers turn three crystal dials; the dials let the backlight through three
// colour filters; the light blends into a colour. Swap the filters and the
// same numbers make a different colour. Every colour on screen comes from the
// model below (SOURCES.md).
import * as k from 'https://cdn.jsdelivr.net/gh/wheresryan22/anatomy@dbf697a527bbf7d358668e1557cb1e35ff725d46/kit/iso-kit.mjs';
const { ease, clamp, lerp, draw, color } = CV;
const W = 1920, H = 1080;

// === THEME ===================================================================
const T = {
  bg: '#131313', ink: '#E6E6E6', muted: '#8F8F8F', dim: '#5A5A5A',
  red: '#FF4B3A', green: '#3BE07A', blue: '#4A7BFF',
  sans: 'Inter, sans-serif', mono: '"JetBrains Mono", monospace',
};
const iso = CV.iso({
  paper: T.bg, ink: T.ink, lit: '#FFFFFF', weight: 1.8,
  tones: { hi: color.mix(T.bg, T.ink, 0.9), mid: color.mix(T.bg, T.ink, 0.56), lo: color.mix(T.bg, T.ink, 0.36), faint: color.mix(T.bg, T.ink, 0.22) },
});

// === THE MODEL ===============================================================
// sRGB numbers → linear light; a panel's filters (primaries) → the colour seen.
const toLin = (v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
const ORANGE = [230, 120, 50];               // the image's numbers (sRGB)
const SEEN = { std: [230, 120, 50], deep: [247, 112, 15] }; // what each panel shows for ORANGE (SOURCES.md)
const FIXED = [216, 126, 67];                // what colour management sends the deep (P3) panel
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const mixRGB = (a, b, p) => a.map((v, i) => Math.round(lerp(v, b[i], p)));
// a crystal dial: open (slot along x) passes all, crossed blocks; transmission = cos²
const angleFor = (v) => Math.acos(Math.sqrt(toLin(v)));
const LIGHT = [[255, 70, 50], [60, 230, 120], [70, 120, 255]];     // the three beams as drawn
const PANE = { std: ['#E2503F', '#3DBB6E', '#4468D8'], deep: ['#8E0618', '#06703A', '#2135A8'] };
const PANE_ALPHA = { std: 0.62, deep: 0.92 };

// === PIXEL MODULE: world units ≈ px, z up ====================================
const PLATE = { x: -150, y: -96, w: 300, d: 192, r: 8 }, PLATE_H = 12, FOOT_H = 5;
const STACK = { x: -96, y: -62, w: 192, d: 124, r: 4 };
const Z = { light: 0, lightTop: 18, pol: 18, polTop: 20, cell: 20, cellTop: 34, cart: 34, cartTop: 39, bezel: 39, bezelTop: 43 };
const CELLS = [0, 1, 2].map((i) => ({ x: -84 + 58 * i, y: -52, w: 52, d: 104, r: 2 }));
const CX = CELLS.map((c) => c.x + c.w / 2);
const DIAL_R = 15;
const DRIVER = { x: 108, y: -58, w: 32, d: 64, r: 3 };
const BEAM_H = 110, MERGE_Z = Z.bezelTop + 122;

// fitted to the machine itself; light and the exploded layers rise above the box
const BOX = { w: 1180, h: 760 };
const P = k.fitProjection(
  [...k.boxCorners(PLATE, -PLATE_H - FOOT_H, 0), ...k.boxCorners(STACK, 0, Z.bezelTop + 10)],
  BOX.w, BOX.h, { pad: 10, azimuth: 40 },
);
const at = (p, Pr = P) => k.iso(p, Pr);
const S = (paths, style) => (ctx) => iso.solid(ctx, paths, style);
const L = (d, style) => (ctx) => iso.line(ctx, d, style);
const D = (pts, style) => (ctx) => iso.dots(ctx, pts, style);
const byDepth = (items, Pr = P) => [...items].sort((a, b) => k.depthOf(a.c, Pr) - k.depthOf(b.c, Pr));
const paint = (ctx, list) => { for (const f of list) f(ctx); };

function basePlate() {
  const out = [(ctx) => iso.halo(ctx, k.haloOf(PLATE, -PLATE_H - FOOT_H, PLATE_H, P), { blur: 16, dy: 6 })];
  for (const [x, y] of k.corners(PLATE, 24).sort((a, b) => k.depthOf([...a, 0], P) - k.depthOf([...b, 0], P))) {
    out.push(S(k.cylinder(x, y, 8, -PLATE_H - FOOT_H, 1.6, P, 28), { tone: 'lo' }));
    out.push(S(k.cylinder(x, y, 6, -PLATE_H - FOOT_H + 1.6, FOOT_H - 1.6, P, 28), { tone: 'mid' }));
  }
  out.push(S(k.slabOf(PLATE, -PLATE_H, PLATE_H, P, 8, 1.6), { tone: 'mid' }));
  out.push(L(k.planOutline(k.insetPlan(PLATE, 6), 0, P), { tone: 'faint' }));
  const screws = k.corners(PLATE, 11);
  out.push(L(screws.map(([x, y]) => k.ring(x, y, 2.4, 0, P, 16)).join(''), { tone: 'lo' }));
  out.push(D(screws.map(([x, y]) => at([x, y, 0])), { size: 0.6 }));
  // ruler strip along the front edge
  const strip = { x: -92, y: PLATE.y + PLATE.d - 20, w: 184, d: 8, r: 1 };
  out.push(S(k.slabOf(strip, 0, 0.8, P, 3), { tone: 'lo', crease: 'none' }));
  const ticks = k.topTicks(strip.x + 4, strip.x + strip.w - 4, 4, 5, strip.y + 1, 0.8, [2.2, 4], P);
  out.push(L(ticks.minor, { tone: 'lo' }), L(ticks.major, { tone: 'mid' }));
  // label plate with three rule lines
  const label = { x: -142, y: 20, w: 34, d: 56, r: 2 };
  out.push(S(k.slabOf(label, 0, 1, P, 3), { tone: 'lo', crease: 'none' }));
  for (const [i, len] of [[0, 40], [1, 32], [2, 22]]) out.push(L(k.lineOnTop([label.x + 8 + i * 7, label.y + 7], [label.x + 8 + i * 7, label.y + 7 + len], 1, P), { tone: 'faint' }));
  out.push(D([at([label.x + 4, label.y + 4, 1]), at([label.x + 4, label.y + label.d - 4, 1]), at([label.x + label.w - 4, label.y + 4, 1]), at([label.x + label.w - 4, label.y + label.d - 4, 1])], { size: 0.5 }));
  // the driver board: where the numbers come in
  out.push((ctx) => iso.halo(ctx, k.haloOf(DRIVER, 0, 1, P), { blur: 4, dy: 2 }));
  out.push(S(k.slabOf(DRIVER, 0, 4, P, 3, 0.5), { tone: 'mid' }));
  const chip = { x: DRIVER.x + 7, y: DRIVER.y + 14, w: 18, d: 22, r: 1 };
  out.push(S(k.slabOf(chip, 4, 3, P, 2, 0.4), { tone: 'hi', crease: 'lo' }));
  const pins = [];
  for (let i = 0; i < 6; i++) { pins.push(at([chip.x - 1.2, chip.y + 3 + i * 3.2, 4])); pins.push(at([chip.x + chip.w + 1.2, chip.y + 3 + i * 3.2, 4])); }
  out.push(D(pins, { size: 0.45, tone: 'hi' }));
  out.push(L(k.ring(chip.x + 4, chip.y + 4, 1.4, 7, P, 12), { tone: 'lo' }));
  out.push(D(k.corners(DRIVER, 3.5).map(([x, y]) => at([x, y, 4])), { size: 0.5 }));
  // connector header on the driver, facing the stack
  const header = { x: DRIVER.x + 1, y: DRIVER.y + 44, w: 8, d: 16, r: 1 };
  out.push(S(k.slabOf(header, 4, 4, P, 2, 0.3), { tone: 'mid' }));
  return out;
}

function backlight() {
  const out = [(ctx) => iso.halo(ctx, k.haloOf(STACK, 0, 1, P), { blur: 8, dy: 3 })];
  out.push(S(k.slabOf(STACK, Z.light, Z.lightTop - Z.light, P, 6, 0.8), { tone: 'mid', inner: (ctx) => iso.line(ctx, k.sideSeam(STACK, 6, P, 6), { tone: 'faint' }) }));
  out.push(L(k.planOutline(k.insetPlan(STACK, 5), Z.lightTop, P), { tone: 'lo' }));
  // the LED bar seen through the diffuser along the front edge
  const leds = []; for (let i = 0; i < 14; i++) leds.push([STACK.x + 14 + i * 12.6, STACK.y + STACK.d - 9]);
  out.push((ctx) => {}); // placeholder slot for the glow (drawn in module())
  out.push(D(leds.map(([x, y]) => at([x, y, Z.lightTop])), { size: 0.9, tone: 'hi' }));
  return out;
}
const DIFFUSER = k.insetPlan(STACK, 5);

function polariser() {
  const plan = k.insetPlan(STACK, 3);
  const out = [S(k.slabOf(plan, Z.pol, Z.polTop - Z.pol, P, 4), { tone: 'lo', crease: 'none' })];
  const lines = [];
  for (let y = plan.y + 6; y < plan.y + plan.d - 4; y += 6) lines.push(k.lineOnTop([plan.x + 4, y], [plan.x + plan.w - 4, y], Z.polTop, P));
  out.push(L(lines.join(''), { tone: 'faint', width: 1.1 }));
  // two pull tabs
  for (const x of [plan.x + 20, plan.x + plan.w - 34]) out.push(S(k.slabOf({ x, y: plan.y - 6, w: 14, d: 8, r: 1.5 }, Z.pol, 1.2, P, 2), { tone: 'lo', crease: 'none' }));
  return out;
}

function cellFrame() {
  const out = [S(k.slabOf(STACK, Z.cell, Z.cellTop - Z.cell, P, 6, 0.8), { tone: 'mid' })];
  for (const c of CELLS) {
    out.push(L(k.planOutline(c, Z.cellTop, P, 3), { tone: 'lo' }));
    out.push(D(k.corners(c, 4).map(([x, y]) => at([x, y, Z.cellTop])), { size: 0.45 }));
  }
  CX.forEach((x) => {
    const t = k.radialTicks(x, 0, DIAL_R + 7, 36, 9, Z.cellTop, [1.6, 3.4], P);
    out.push(L(t.minor, { tone: 'lo' }), L(t.major, { tone: 'mid' }));
    // the open mark (slot along x) and the closed mark
    out.push(D([at([x + DIAL_R + 11, 0, Z.cellTop]), at([x - DIAL_R - 11, 0, Z.cellTop])], { size: 0.8, tone: 'hi' }));
  });
  // flex connector on the +x face
  const flex = { x: STACK.x + STACK.w, y: -10, w: 5, d: 26, r: 1 };
  out.push(S(k.slabOf(flex, Z.cell + 3, 7, P, 2, 0.3), { tone: 'mid' }));
  out.push(D([0, 1, 2, 3, 4].map((i) => at([flex.x + 5, flex.y + 4 + i * 4.5, Z.cell + 6.5])), { size: 0.45, tone: 'hi' }));
  return out;
}
const dialSolid = CX.map((x) => k.cylinder(x, 0, DIAL_R, Z.cellTop, 2.4, P, 48, 0.5));
function dial(ctx, i, theta, { lit = false } = {}) {
  const x = CX[i], z = Z.cellTop + 2.4;
  iso.solid(ctx, dialSolid[i], { tone: 'hi', crease: 'lo', lit });
  const c = Math.cos(theta), s = Math.sin(theta), r = DIAL_R - 2.4, w = 2.2;
  // the slot: a long narrow window across the dial
  const pts = [[x - c * r - s * w, -s * r + c * w], [x + c * r - s * w, s * r + c * w], [x + c * r + s * w, s * r - c * w], [x - c * r + s * w, -s * r - c * w]];
  iso.line(ctx, k.onTop(pts, z, P, true), { tone: lit ? 'lit' : 'mid' });
  iso.line(ctx, k.ring(x, 0, 2.2, z, P, 16), { tone: 'lo' });
}

const CART_BARS = [
  { x: -96, y: -62, w: 192, d: 10, r: 2 }, { x: -96, y: -52, w: 12, d: 104, r: 0 },
  { x: -32, y: -52, w: 6, d: 104, r: 0 }, { x: 26, y: -52, w: 6, d: 104, r: 0 },
  { x: 84, y: -52, w: 12, d: 104, r: 0 }, { x: -96, y: 52, w: 192, d: 10, r: 2 },
];
const WINDOWS = CELLS.map((c) => ({ x: c.x, y: c.y, w: c.w, d: c.d, r: 0 }));
function cartridge(set) {
  const out = [];
  WINDOWS.forEach((w, i) => out.push((ctx) => {
    ctx.save(); ctx.globalAlpha *= PANE_ALPHA[set];
    ctx.fillStyle = PANE[set][i]; ctx.fill(iso.path(k.slabOf(w, Z.cart + 1, 2, P, 1).fill));
    ctx.restore();
    iso.line(ctx, k.planOutline(w, Z.cart + 3, P, 1), { tone: 'lo' });
  }));
  for (const b of CART_BARS) out.push(S(k.slabOf(b, Z.cart, Z.cartTop - Z.cart, P, 2, b.r ? 0.5 : 0), { tone: 'mid', crease: 'faint' }));
  // the pull tab with grip ridges, on the +x side
  const tab = { x: 96, y: -16, w: 12, d: 32, r: 3 };
  out.push(S(k.slabOf(tab, Z.cart + 0.5, 3.5, P, 3, 0.4), { tone: 'hi', crease: 'lo' }));
  out.push(L([0, 1, 2, 3, 4].map((i) => k.lineOnTop([tab.x + 3 + i * 1.6, tab.y + 6], [tab.x + 3 + i * 1.6, tab.y + tab.d - 6], Z.cart + 4, P)).join(''), { tone: 'lo' }));
  // set marking: dots on the front bar, one for standard, two for deep
  out.push(D((set === 'std' ? [0] : [0, 1]).map((j) => at([-80 + j * 5, 57, Z.cartTop])), { size: 0.9, tone: 'hi' }));
  return out;
}
const CART = { std: cartridge('std'), deep: cartridge('deep') };

function bezel() {
  const bars = [
    { x: -96, y: -62, w: 192, d: 9, r: 3 }, { x: -96, y: -53, w: 9, d: 106, r: 0 },
    { x: 87, y: -53, w: 9, d: 106, r: 0 }, { x: -96, y: 53, w: 192, d: 9, r: 3 },
  ];
  const out = bars.map((b) => S(k.slabOf(b, Z.bezel, Z.bezelTop - Z.bezel, P, 3, b.r ? 0.6 : 0), { tone: 'mid' }));
  const screws = [[-91.5, -57.5], [91.5, -57.5], [-91.5, 57.5], [91.5, 57.5]];
  out.push(L(screws.map(([x, y]) => k.ring(x, y, 2.2, Z.bezelTop, P, 14)).join(''), { tone: 'lo' }));
  out.push(D(screws.map(([x, y]) => at([x, y, Z.bezelTop])), { size: 0.55 }));
  return out;
}
const GLASS_LINES = (() => {
  const out = [];
  for (let x = -84; x <= 84; x += 7) out.push(k.lineOnTop([x, -50], [x, 50], Z.bezelTop - 1.5, P));
  return out.join('');
})();

const PARTS = { base: basePlate(), light: backlight(), pol: polariser(), cell: cellFrame(), bezel: bezel() };

// The pixel module at a pose: { lift: [l1..l5] z offsets, dials: [θ×3], glow 0..1,
// set: 'std'|'deep', cart: { dx, dz, set }, beams: 0..1, values, merge 0..1, litDial }
function module(ctx, pose) {
  const lift = pose.lift ?? [0, 0, 0, 0, 0];
  const shift = (dz, fn, dx = 0) => { const [x, y] = k.axisVector(P, [dx, 0, dz]); ctx.save(); ctx.translate(x, y); fn(); ctx.restore(); };
  paint(ctx, PARTS.base);
  // ribbon from the driver header to the cell frame's flex connector (rides the cell layer)
  const from = at([DRIVER.x + 5, DRIVER.y + 52, 8]);
  const [, ly] = k.axisVector(P, [0, 0, lift[2]]);
  const to = at([STACK.x + STACK.w + 5, 3, Z.cell + 6.5]);
  iso.wire(ctx, from, [to[0], to[1] + ly], { via: [[from[0] + 4, from[1] - 10], [to[0] + 22, to[1] + ly + 4]], tone: 'lo', size: 1.4 });
  shift(lift[0], () => {
    paint(ctx, PARTS.light);
    const g = pose.glow ?? 0;
    if (g > 0) {
      ctx.save(); ctx.globalAlpha *= 0.3 * g; ctx.fillStyle = '#F4F1EA';
      ctx.fill(iso.path(k.slabOf(DIFFUSER, Z.lightTop, 0.01, P, 4).fill)); ctx.restore();
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha *= 0.3 * g;
      ctx.filter = `blur(${(10 * Math.hypot(ctx.getTransform().a, ctx.getTransform().b)).toFixed(1)}px)`;
      ctx.fillStyle = '#FFFFFF'; ctx.fill(iso.path(k.slabOf(DIFFUSER, Z.lightTop, 0.01, P, 4).fill)); ctx.restore();
    }
  });
  shift(lift[1], () => paint(ctx, PARTS.pol));
  shift(lift[2], () => {
    paint(ctx, PARTS.cell);
    (pose.dials ?? [Math.PI / 2, Math.PI / 2, Math.PI / 2]).forEach((th, i) => dial(ctx, i, th, { lit: pose.litDial === i || pose.litDial === 'all' }));
  });
  const carts = [pose.cart ?? { dx: 0, dz: 0, set: 'std' }, pose.cart2].filter(Boolean)
    .sort((a, b) => k.depthOf([a.dx ?? 0, 0, a.dz ?? 0], P) - k.depthOf([b.dx ?? 0, 0, b.dz ?? 0], P));
  for (const c of carts) {
    ctx.save(); ctx.globalAlpha *= c.alpha ?? 1;
    shift(lift[3] + (c.dz ?? 0), () => paint(ctx, CART[c.set ?? 'std']), c.dx ?? 0);
    ctx.restore();
  }
  shift(lift[4], () => {
    paint(ctx, PARTS.bezel);
    iso.line(ctx, GLASS_LINES, { tone: 'faint', width: 1, alpha: 0.6 });
  });
  if ((pose.beams ?? 0) > 0) beams(ctx, pose, lift[4]);
}

// Light rising from each window, tapering toward one point when it blends.
function hull(pts) {
  const p = [...pts].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (const q of p.reverse()) { while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
function beams(ctx, pose, dz) {
  const vals = pose.values ?? ORANGE, m = pose.merge ?? 0, b = pose.beams;
  const z0 = Z.bezelTop + dz, z1 = z0 + lerp(BEAM_H, MERGE_Z - Z.bezelTop, m);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  WINDOWS.forEach((w, i) => {
    const a = (vals[i] / 255) * b;
    if (a <= 0.003) return;
    const bot = [[w.x + 3, w.y + 3], [w.x + w.w - 3, w.y + 3], [w.x + w.w - 3, w.y + w.d - 3], [w.x + 3, w.y + w.d - 3]];
    const top = bot.map(([x, y]) => [lerp(x, x * 0.08, m), lerp(y, y * 0.08, m)]);
    const pts = [...bot.map(([x, y]) => at([x, y, z0])), ...top.map(([x, y]) => at([x, y, z1]))];
    const [, yb] = at([CX[i], 0, z0]), [, yt] = at([CX[i], 0, z1]);
    const g = ctx.createLinearGradient(0, yb, 0, yt);
    const c = LIGHT[i];
    g.addColorStop(0, rgb(c, 0.5 * a)); g.addColorStop(0.7, rgb(c, 0.22 * a * (1 - m * 0.3))); g.addColorStop(1, rgb(c, m > 0.5 ? 0.35 * a : 0));
    ctx.fillStyle = g;
    const h = hull(pts);
    ctx.beginPath(); h.forEach(([x, y], j) => (j ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); ctx.fill();
    // the pane itself glows
    ctx.fillStyle = rgb(c, 0.4 * a);
    ctx.fill(iso.path(k.slabOf(w, z0 - 0.5, 0.01, P, 1).fill));
  });
  ctx.restore();
  if (m > 0.02 && pose.mixed) {
    // where the three meet, the eye sees one colour
    const r = 30 * ease.outCubic(clamp((m - 0.4) / 0.6));
    if (r > 0.5) {
      const ring = k.slabOf({ x: -r, y: -r, w: 2 * r, d: 2 * r, r }, z1 + dz * 0 - 0.5, 0.01, P, 16).fill;
      ctx.save();
      ctx.filter = `blur(${(14 * Math.hypot(ctx.getTransform().a, ctx.getTransform().b)).toFixed(1)}px)`;
      ctx.globalAlpha = 0.55; ctx.fillStyle = rgb(pose.mixed); ctx.fill(iso.path(ring)); ctx.restore();
      ctx.fillStyle = rgb(pose.mixed); ctx.fill(iso.path(ring));
      iso.line(ctx, k.ring(0, 0, r, z1, P, 48), { tone: 'hi', alpha: 0.6 });
    }
  }
}

// === MONITORS: a desk with two screens ======================================
const DESK = { x: -330, y: -95, w: 660, d: 190, r: 10 }, DESK_H = 10;
const MON = [-160, 160];
const PANEL = (cx) => ({ x: cx - 122, y: -16, w: 244, d: 10, r: 3 });
const SCREEN_Z = [60, 196];
const MBOX = { w: 1640, h: 720 };
const PM = k.fitProjection(
  [...k.boxCorners({ x: -290, y: -60, w: 580, d: 120 }, -DESK_H, 0), [MON[0] - 122, -16, 206], [MON[1] + 122, -6, 206], [MON[0] - 122, -6, 52], [MON[1] + 122, -6, 52]],
  MBOX.w, MBOX.h, { pad: 10, azimuth: 66 },
);
const atM = (p) => k.iso(p, PM);
function monitorParts(cx) {
  const out = [];
  const foot = { x: cx - 52, y: -46, w: 104, d: 62, r: 10 };
  out.push((ctx) => iso.halo(ctx, k.haloOf(foot, 0, 1, PM), { blur: 8, dy: 3 }));
  out.push(S(k.slabOf(foot, 0, 5, PM, 8, 0.8), { tone: 'mid' }));
  out.push(L(k.planOutline(k.insetPlan(foot, 6), 5, PM), { tone: 'faint' }));
  const neck = { x: cx - 9, y: -34, w: 18, d: 12, r: 3 };
  out.push(S(k.slabOf(neck, 5, 66, PM, 4, 0.4), { tone: 'mid' }));
  out.push(L(k.ring(cx, -28, 3.2, 5, PM, 14), { tone: 'lo' }));
  // the VESA box behind the panel
  const back = { x: cx - 50, y: -26, w: 100, d: 10, r: 4 };

        const landed = Math.max(clamp(1 - out / 90), clamp(1 - drop / 30));
        const mixed = mixRGB(SEEN.std, SEEN.deep, ease.inOutCubic(s.at(tIn + 0.25, 0.9)));
        draw.camera(ctx, W, H, { zoom: 0.94, focusX: W / 2 + 40, focusY: H / 2 - 30 }, () => {
          ctx.save(); ctx.translate(MX - 60, MY + 60);
          module(ctx, {
            glow: 1, dials: STD_DIALS, beams: landed, values: ORANGE, merge: 1, mixed,
            cart: { set: 'std', dx: out, alpha: clamp(1 - (out - 120) / 120) },
            cart2: s.t > tIn - 0.4 ? { set: 'deep', dz: drop, alpha: clamp(1 - (drop - 150) / 60) } : null,
          });
          ctx.restore();
        });
        // the swatch: before / now, and the numbers that did not change
        const sx = 1450, sy = 300, sw = 340, sh = 230;
        const sa = s.at(0, 0.6);
        ctx.save(); ctx.globalAlpha = sa;
        ctx.fillStyle = rgb(SEEN.std); ctx.fillRect(sx, sy, sw / 2, sh);
        ctx.fillStyle = rgb(mixed); ctx.fillRect(sx + sw / 2, sy, sw / 2, sh);
        ctx.restore();
        iso.line(ctx, `M${sx} ${sy}h${sw}v${sh}h${-sw}Z`, { tone: 'lo', alpha: sa });
        label(ctx, 'before', sx, sy - 26, 50, { alpha: sa, weight: 600 });
        label(ctx, 'now', sx + sw, sy - 26, 50, { align: 'right', alpha: sa, col: T.ink, weight: 600 });
        numbers(ctx, ORANGE, sx + sw / 2, sy + sh + 110, 64, { alpha: sa });
        label(ctx, 'same numbers', sx + sw / 2, sy + sh + 180, 44, { align: 'center', col: T.ink, alpha: s.at(s.when('Same numbers', 2.5), 0.5) });
      },
    },
    // 9 — the hook again, read: the same numbers through different filters
    {
      id: 'name', voiceDelay: 0.4, tail: 0.6, energy: 0.5,
      draw(ctx, s) {
        const zoom = lerp(1.08, 1.0, ease.outCubic(s.at(0, 3)));
        draw.camera(ctx, W, H, { zoom, focusX: W / 2, focusY: H / 2 + 40 }, () => {
          ctx.save(); ctx.translate(MOX, MOY); desk(ctx, { content: (c) => onScreenNumbers(c, ORANGE) }); ctx.restore();
        });
        const tt = s.at(s.when('color difference', 0.3) - 0.05, 0.6);
        ctx.save(); ctx.globalAlpha = tt; ctx.font = `700 92px ${T.sans}`; ctx.fillStyle = T.ink; ctx.textAlign = 'center';
        ctx.fillText('Color difference', W / 2, 140 - (1 - tt) * 12); ctx.restore();
        const la = s.at(s.when('different filters', 4.9) - 0.1, 0.5);
        ['standard filters', 'deeper filters'].forEach((t, i) => {
          const [x, y] = screenBottom(i);
          label(ctx, t, x, y + 84, 44, { align: 'center', col: T.ink, alpha: la });
        });
      },
    },
    // 10 — colour management: the deeper screen gets its own numbers
    {
      id: 'fix', voiceDelay: 0.4, tail: 0.8, energy: 0.65,
      draw(ctx, s) {
        const tTag = s.when('image', 1.5), tR = s.when('rewrites', 4.1);
        const roll = s.at(tR, 0.9, ease.inOutCubic);
        const right = ORANGE.map((v, i) => lerp(v, FIXED[i], roll));
        const col = mixRGB(SEEN.deep, SEEN.std, roll);
        draw.camera(ctx, W, H, { zoom: lerp(1, 1.04, ease.inOutSine(s.p)), focusX: W / 2, focusY: H / 2 + 40 }, () => {
          ctx.save(); ctx.translate(MOX, MOY);
          desk(ctx, { cols: [SEEN.std, col], content: (c, i) => onScreenNumbers(c, i ? right : ORANGE, { tag: 'sRGB image', tagAlpha: s.at(tTag, 0.5) }) });
          ctx.restore();
        });
        ['standard filters', 'deeper filters'].forEach((t, i) => {
          const [x, y] = screenBottom(i);
          label(ctx, t, x, y + 84, 44, { align: 'center', col: T.muted });
        });
        const [rx, ry] = screenBottom(1);
        label(ctx, 'new numbers for its filters', rx, ry + 140, 40, { align: 'center', col: T.ink, alpha: s.at(tR + 0.4, 0.5) });
      },
    },
    // 11 — same orange, different numbers
    {
      id: 'land', voiceDelay: 0.4, tail: 2.0, energy: 0.45,
      draw(ctx, s) {
        draw.camera(ctx, W, H, { zoom: lerp(1.0, 1.05, ease.inOutSine(s.p)), focusX: W / 2, focusY: H / 2 - 10 }, () => {
          ctx.save(); ctx.translate(MOX, MOY);
          desk(ctx, { cols: [SEEN.std, SEEN.std], content: (c, i) => onScreenNumbers(c, i ? FIXED : ORANGE) });
          ctx.restore();
        });
        const a1 = s.at(s.when('Same orange', 0.1) - 0.05, 0.5), a2 = s.at(s.when('Different numbers', 1.7) - 0.05, 0.5);
        ctx.save(); ctx.font = `700 92px ${T.sans}`; ctx.textAlign = 'left'; ctx.fillStyle = T.ink;
        const w1 = ctx.measureText('Same orange.').width, w2 = ctx.measureText('Different numbers.').width, gap = 40;
        const x0 = (W - w1 - gap - w2) / 2;
        ctx.globalAlpha = a1; ctx.fillText('Same orange.', x0, 118);
        ctx.globalAlpha = a2; ctx.fillText('Different numbers.', x0 + w1 + gap, 118);
        ctx.restore();
      },
    },
    // 12 — credit: the machine, at rest
    {
      id: 'credit', narration: false, beats: 8, energy: 0.3,
      draw(ctx, s) {
        const a = s.at(0.2, 0.8);
        ctx.save(); ctx.translate(90, 250); ctx.scale(0.78, 0.78);
        module(ctx, { glow: 1, dials: STD_DIALS, beams: 1, values: ORANGE, merge: 1, mixed: SEEN.std });
        ctx.restore();
        ctx.save(); ctx.globalAlpha = a;
        label(ctx, 'Isometric machine drawn with', 1080, 430, 40, { col: T.muted });
        label(ctx, 'the anatomy kit', 1080, 530, 96, { col: T.ink, weight: 700 });
        label(ctx, 'by @wheresryan22', 1080, 610, 44, { col: T.ink, weight: 500 });
        label(ctx, 'skills.wheresryan.sh/anatomy', 1080, 690, 40, { col: T.muted });
        label(ctx, 'Narration: Qwen-TTS (AI voice)', 1080, 790, 32, { col: T.muted });
        ctx.restore();
      },
    },
  ],
});
</script>
