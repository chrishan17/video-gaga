<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>一百天，把心里话画出来</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Long+Cang&family=Caveat:wght@500;700&family=Noto+Sans+SC:wght@500&display=block" rel="stylesheet">
</head>
<body>
<script src="build/narration.js"></script>
<script src="../../runtime/video-gaga.js"></script>
<script>
/* =============================================================================
   一百天，把心里话画出来 — a 2.5-minute personal story in the Paper Sketch style.
   Six chapters, each marked by a handwritten tag in the corner so a viewer
   always knows where they are. Music-only beats between chapters let the
   story breathe; the very first wobbly circle comes back at the end as a face.
   ============================================================================= */
const { ease, clamp, lerp, fx, draw, color, rand } = CV;

// Scaffolded by `cv init`: only this preset's STYLE was copied. THEME is the palette
// and type. KIT is an optional toolbox of the style's signature moves: use, change or
// delete any of it, and write the new helpers this video needs. The scenes, their
// structure, the choreography and the score are designed fresh for this brief.

// === THEME ===================================================================
const T = {
  paper: '#F1E9D8',
  ink: '#2B2A28',
  pencil: '#6E675C',
  red: '#D1495B',
  green: '#4F8A4B',
  blue: '#3D6FB6',
  marker: 'rgba(255, 216, 77, 0.75)',
  title: '"ZCOOL KuaiLe", "Noto Sans SC", sans-serif',
  hand: '"Long Cang", "ZCOOL KuaiLe", cursive',
  latin: '"Caveat", cursive',
};
const F = (w, px, fam) => `${w} ${px}px ${fam}`;

// === KIT: pencil, boil, wash =================================================
// Boil: the jitter seed changes every 3 frames (12 fps at 30 fps output).
const boil = (s, base) => base * 131 + Math.floor(s.frame / 3);

// A pencil stroke drawn on progressively; double pass for a graphite feel.
function pencil(ctx, pts, p, col = T.ink, width = 5) {
  if (p <= 0) return;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = col;
  ctx.lineWidth = width;
  draw.drawOn(ctx, pts, p);
  ctx.globalAlpha *= 0.35;
  ctx.lineWidth = width * 0.5;
  ctx.translate(1.5, 1);
  draw.drawOn(ctx, pts, p);
  ctx.restore();
}
const line = (s, seed, x1, y1, x2, y2, rough = 2) => draw.sketchLine(x1, y1, x2, y2, { seed: boil(s, seed), roughness: rough });
const circle = (s, seed, x, y, r, rough = 3) => draw.sketchCircle(x, y, r, { seed: boil(s, seed), roughness: rough, steps: Math.max(36, Math.round(r / 3)) });

// Watercolour-ish fill: offset translucent blobs, clipped to a wobbly circle.
function wash(ctx, pts, col, p) {
  if (p <= 0) return;
  ctx.save();
  ctx.globalAlpha *= 0.8 * p;
  ctx.fillStyle = col;
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(x + 3, y + 2) : ctx.moveTo(x + 3, y + 2)));
  ctx.fill();
  ctx.restore();
}

// === KIT: marker, arrows, paper, hand lettering ==============================
function highlight(ctx, x, y, w, h, p) {
  if (p <= 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = T.marker;
  ctx.beginPath();
  ctx.moveTo(x, y + 4);
  ctx.lineTo(x + w * p, y);
  ctx.lineTo(x + w * p - 6, y + h);
  ctx.lineTo(x + 4, y + h - 3);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function arrow(ctx, s, seed, x1, y1, x2, y2, p, col = T.pencil) {
  const mid = [(x1 + x2) / 2 + (y2 - y1) * 0.15, (y1 + y2) / 2 - (x2 - x1) * 0.15];
  const pts = [...line(s, seed, x1, y1, mid[0], mid[1], 2), ...line(s, seed + 1, mid[0], mid[1], x2, y2, 2)];
  pencil(ctx, pts, p, col, 4);
  if (p > 0.95) {
    const a = Math.atan2(y2 - mid[1], x2 - mid[0]);
    const hp = clamp((p - 0.95) / 0.05);
    for (const d of [-0.5, 0.5]) pencil(ctx, line(s, seed + 5 + d, x2, y2, x2 - Math.cos(a + d) * 30, y2 - Math.sin(a + d) * 30, 1), hp, col, 4);
  }
}

// Paper texture, rendered once and reused every frame.
let paperTex = null;
function paper(ctx, W, H) {
  if (!paperTex) {
    paperTex = document.createElement('canvas');
    paperTex.width = W; paperTex.height = H;
    const g = paperTex.getContext('2d');
    g.fillStyle = T.paper;
    g.fillRect(0, 0, W, H);
    const r = rand(5);
    for (let i = 0; i < 1400; i++) {
      g.strokeStyle = `rgba(120,100,70,${0.03 + r() * 0.05})`;
      g.lineWidth = 0.6 + r();
      const x = r() * W, y = r() * H, a = r() * Math.PI, l = 6 + r() * 26;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
    const v = g.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(90,60,20,0.18)');
    g.fillStyle = v;
    g.fillRect(0, 0, W, H);
  }
  ctx.drawImage(paperTex, 0, 0, W, H);
}

// Per-character start times for hand-lettered text: each character lands
// with the word that says it, and characters inside one word follow each
// other like a pen (step s apart) instead of popping together.
function handTimes(ctx, s, str, step = 0.08) {
  const units = CV.text.words(ctx, str, 0, 0).map((w) => w.text);
  const ts = s.syncTimes(units).slice();
  for (let i = 1; i < ts.length; i++) if (ts[i] <= ts[i - 1] + step * 0.5) ts[i] = ts[i - 1] + step;
  return ts;
}

// Smooth curve as sketchy points (quadratic bezier, jittered on threes).
function sketchCurve(s, seed, x1, y1, cx, cy, x2, y2, n = 40, rough = 2) {
  const r = rand(boil(s, seed)), pts = [];
  for (let i = 0; i <= n; i++) {
    const k = i / n, j = (r() - 0.5) * rough * Math.sin(Math.PI * k);
    pts.push([(1 - k) ** 2 * x1 + 2 * (1 - k) * k * cx + k * k * x2 + j, (1 - k) ** 2 * y1 + 2 * (1 - k) * k * cy + k * k * y2 + j]);
  }
  return pts;
}

// === KIT: page-slide transition ==============================================
// Page-slide transition: the new sheet slides over with a soft shadow.
function pageSlide(ctx, A, B, p) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  ctx.drawImage(A, 0, 0);
  ctx.fillStyle = `rgba(40,30,10,${0.15 * p})`;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  const x = (1 - p) * W * 1.02;
  ctx.translate(x, 0);
  ctx.rotate((1 - p) * 0.03);
  ctx.shadowColor = 'rgba(40,30,10,0.35)';
  ctx.shadowBlur = 40;
  ctx.shadowOffsetX = -12;
  ctx.drawImage(B, 0, 0);
  ctx.restore();
}


// === KIT (this video): figures, sketchbook, chapters =========================
// draw-on progress of a stroke that starts at t0 and takes d seconds
const on = (t, t0, d = 0.5) => ease.inOutCubic(clamp((t - t0) / d));
const poly = (s, seed, pts, rough = 2) => pts.slice(1).flatMap((q, i) => line(s, seed + i * 3, pts[i][0], pts[i][1], q[0], q[1], rough));
const rect = (s, seed, x, y, w, h, rough = 2) => poly(s, seed, [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]], rough);

// A stick figure, drawn head first like a hand would. (x, y) = feet, k = scale
// (1 ≈ 300 px tall). Poses: stand, cheer, sit (side view, facing right), doze.
function person(ctx, s, seed, x, y, k, p, { pose = 'stand', col = T.ink, w = 6 } = {}) {
  if (p <= 0) return;
  const P = (a, b) => [x + a * k, y + b * k];
  const seg = (i, a, b) => line(s, seed + i * 7, ...P(...a), ...P(...b), 1.5);
  const part = (a, b) => clamp((p - a) / (b - a));
  let head, strokes;
  if (pose === 'sit' || pose === 'doze') {
    head = pose === 'doze' ? P(18, -208) : P(0, -215);
    strokes = [
      [0.25, 0.5, [seg(1, [0, -175], [-6, -70])]],
      [0.45, 0.75, [seg(2, [-2, -150], [72, -112]), seg(3, [-2, -150], [60, -100])]],
      [0.7, 1, [seg(4, [-6, -70], [70, -70]), seg(5, [70, -70], [70, 0])]],
    ];
  } else {
    head = P(0, -255);
    const up = pose === 'cheer';
    strokes = [
      [0.25, 0.5, [seg(1, [0, -215], [0, -95])]],
      [0.45, 0.75, [seg(2, [0, -185], up ? [-70, -265] : [-60, -120]), seg(3, [0, -185], up ? [70, -265] : [60, -120])]],
      [0.7, 1, [seg(4, [0, -95], [-45, 0]), seg(5, [0, -95], [45, 0])]],
    ];
  }
  pencil(ctx, circle(s, seed, head[0], head[1], 40 * k, 2), ease.inOutCubic(part(0, 0.3)), col, w);
  for (const [a, b, list] of strokes) for (const pts of list) pencil(ctx, pts, ease.inOutCubic(part(a, b)), col, w);
}

// A spiral-bound sketchbook, cover or open page.
function sketchbook(ctx, s, seed, x, y, w, h, p, { fill = 'rgba(255,252,244,0.9)' } = {}) {
  if (p <= 0) return;
  const outline = rect(s, seed, x, y, w, h, 2.5);
  wash(ctx, outline, fill, clamp((p - 0.5) / 0.4));
  pencil(ctx, outline, ease.inOutCubic(clamp(p / 0.6)), T.ink, 6);
  const n = Math.round(w / 70);
  for (let i = 0; i < n; i++) {
    const cx = x + (i + 0.5) * (w / n);
    pencil(ctx, circle(s, seed + 40 + i, cx, y, 13, 1).slice(0, 30), clamp((p - 0.55 - i * 0.03) / 0.15), T.pencil, 4);
  }
}

// "Day N" written in the corner of a sketchbook page.
function dayTag(ctx, s, n, x, y, t0) {
  ctx.save();
  ctx.font = F(700, 64, T.latin);
  ctx.fillStyle = T.red;
  ctx.textAlign = 'left';
  fx.charReveal(ctx, `Day ${n}`, x, y, s.t - t0, { stagger: 0.06, dur: 0.25, rise: 0.1 });
  ctx.restore();
}

// Handwritten text that lands character by character with the voice.
function say(ctx, s, str, x, y, { size = 90, fam = T.title, col = T.ink, align = 'left', step = 0.07, exit = 0 } = {}) {
  ctx.save();
  ctx.font = F(400, size, fam);
  ctx.fillStyle = col;
  ctx.textAlign = align;
  fx.wordReveal(ctx, str, x, y, s.t, { times: handTimes(ctx, s, str, step), dur: 0.3, rise: 0.12, align, exit });
  ctx.restore();
}

// Plain handwritten note that appears from t0 (not tied to the voice).
function note(ctx, s, str, x, y, t0, { size = 72, fam = T.hand, col = T.ink, align = 'left', stagger = 0.07, exit = 0 } = {}) {
  ctx.save();
  ctx.font = F(400, size, fam);
  ctx.fillStyle = col;
  ctx.textAlign = align;
  fx.charReveal(ctx, str, x, y, s.t - t0, { stagger, dur: 0.3, rise: 0.1, align, exit });
  ctx.restore();
}

// A speech or thought bubble around (x, y, w, h).
function bubble(ctx, s, seed, x, y, w, h, p, { thought = false, tailTo = null, col = T.ink, fill = 'rgba(255,252,244,0.85)' } = {}) {
  if (p <= 0) return;
  const cx = x + w / 2, cy = y + h / 2, pts = [];
  const r = rand(seed * 13 + Math.floor(s.frame / 3));
  for (let i = 0; i <= 64; i++) {
    const a = (i / 64) * Math.PI * 2;
    const bump = thought ? 1 + 0.06 * Math.abs(Math.sin(a * 5)) : 1;
    pts.push([cx + Math.cos(a) * w / 2 * bump + (r() - 0.5) * 2.5, cy + Math.sin(a) * h / 2 * bump + (r() - 0.5) * 2.5]);
  }
  wash(ctx, pts, fill, clamp((p - 0.4) / 0.4));
  pencil(ctx, pts, ease.inOutCubic(clamp(p / 0.7)), col, 5);
  if (tailTo) {
    const tp = clamp((p - 0.6) / 0.4);
    if (thought) {
      [0.35, 0.65, 0.88].forEach((k, i) => pencil(ctx, circle(s, seed + 90 + i, lerp(cx, tailTo[0], k), lerp(y + h, tailTo[1], k), 16 - i * 4, 1), clamp(tp * 3 - i), col, 4));
    } else {
      pencil(ctx, poly(s, seed + 80, [[cx - 40, y + h - 6], tailTo, [cx + 10, y + h - 4]], 1), tp, col, 5);
    }
  }
}

// A green hand-drawn check mark.
const check = (ctx, s, seed, x, y, p, k = 1) => pencil(ctx, poly(s, seed, [[x - 35 * k, y], [x - 8 * k, y + 30 * k], [x + 45 * k, y - 40 * k]], 1), p, T.green, 8);

// Chapter tag in the top-left corner: the viewer always knows where they are
// in a long piece. Drawn by the overlay from each scene's `chapter`.
function chapterTag(ctx, g) {
  const cur = g.scenes.filter((sc) => sc.start <= g.T + 1e-6).pop();
  if (!cur || !cur.chapter) return;
  const first = g.scenes.find((sc) => sc.chapter === cur.chapter);
  const lt = g.T - first.start - (first.index ? 0.75 : 0.4);
  const last = g.scenes.filter((sc) => sc.chapter === cur.chapter).pop();
  const fade = last.index === g.scenes.length - 1 ? clamp((g.duration - g.T - 1.5) / 0.6) : 1;
  ctx.save();
  ctx.globalAlpha = clamp(lt / 0.6) * fade * 0.9;
  ctx.font = F(400, 56, T.hand);
  ctx.fillStyle = T.ink;
  ctx.textAlign = 'left';
  ctx.fillText(cur.chapter, 96, 112);
  const w = ctx.measureText(cur.chapter).width;
  ctx.strokeStyle = T.pencil;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(96, 130);
  ctx.lineTo(96 + w * ease.outCubic(clamp((lt - 0.2) / 0.6)), 133);
  ctx.stroke();
  ctx.restore();
}

// === VIDEO ===================================================================
const slide = { type: pageSlide, duration: 0.75, ease: ease.inOutCubic, sfx: 'paper' };
// local window that finishes just before the next page slides in
const clearDesk = (s, d = 0.4) => s.out(d, ease.exit, 0.75);
const C1 = '一 · 一本速写本', C2 = '二 · 放下的笔', C3 = '三 · 每天五分钟', C4 = '四 · 一百天', C5 = '五 · 三件事', C6 = '六 · 轮到你';

// the very first circle: wobbly, never quite closed (it returns at the end)
const firstCircle = (s, x, y, r) => draw.sketchCircle(x, y, r, { seed: boil(s, 77), roughness: 14, steps: 60 }).slice(0, 56);

CV.create({
  width: 1920, height: 1080, fps: 30,
  background: T.paper,
  lang: 'zh-CN',
  transition: slide,
  voiceDelay: 0.3, tail: 0.6,
  subtitles: {
    style: { font: '500 42px "Noto Sans SC", sans-serif', color: T.ink, box: 'rgba(255,250,238,0.82)', y: 0.92, radius: 6 },
  },
  overlay: chapterTag,
  // honest, warm, hopeful: a fingerpicked D major bed, soft keys, kalimba in the gaps.
  // Three minutes on one loop would wear thin, so each chapter has its own
  // harmony (parts): the instruments stay, the chords and the melody move.
  music: {
    bpm: 88, seed: 11, key: 'D', mode: 'major', progression: [0, 4, 5, 3],
    parts: {
      stuck: { key: 'B', mode: 'minor', progression: [0, 5, 2, 6], chordBars: 2, seed: 4, lead: { rhythm: 'sparse' } }, // the pen put down
      start: { progression: [0, 3, 0, 4], seed: 21 },                         // a small rule, a fresh start
      hundred: { progression: [5, 3, 0, 4], seed: 8, lead: { rhythm: 'rhythmic' } }, // momentum: a hundred days
      lessons: { progression: [3, 4, 5, 0], sevenths: true, seed: 15 },        // what it taught me
      home: { progression: [3, 0, 4, 0], chordBars: 2, seed: 2, lead: { rhythm: 'sparse' } }, // your turn, coming home
    },
    layers: [
      { name: 'pad', inst: 'sinepad', notes: 'chord', pattern: 'X---', vel: 0.06 },
      { name: 'keys', inst: 'keys', notes: 'chord', pattern: 'X.....x.', gate: 2.5, vel: [0.05, 0.08], bright: 0.3, from: 0.3 },
      { name: 'bass', inst: 'bass', octave: -1, notes: ['root', 'fifth_'], pattern: 'X-----x.', vel: 0.22, from: 0.4 },
      { name: 'picking', inst: 'pluck', notes: ['root_', 2, 'fifth_', 1, 'root_', 2, 'fifth_', '0^'], pattern: 'XxXxXxXx', gate: 3, vel: 0.13, bright: 0.3, from: 0.5 },
      { name: 'shaker', inst: 'shaker', pattern: 'xXxXxXxX', vel: 0.04, from: 0.55 },
      { name: 'snaps', inst: 'snap', pattern: '.X.X', vel: 0.14, from: 0.65 },
      { name: 'kick', inst: 'kick', pattern: 'X... .... X.x. ....', vel: 0.32, from: 0.72 },
    ],
    lead: { inst: 'bell', kind: 'kalimba', range: [69, 86], rhythm: 'melodic', vel: 0.11, echo: 0.12 },
  },
  scenes: [
    // ===== 一 · 一本速写本 ===================================================
    {
      id: 'open', chapter: C1, voiceDelay: 2.0, energy: 0.3,
      draw(ctx, s) {
        const { W, H, t } = s;
        paper(ctx, W, H);
        const b0 = s.onBeat(0);
        sketchbook(ctx, s, 10, 620, 250, 680, 520, on(t, b0, 1.6), { fill: 'rgba(61,111,182,0.18)' });
        ctx.save();
        ctx.font = F(700, 64, T.latin);
        ctx.fillStyle = T.blue;
        ctx.textAlign = 'center';
        ctx.globalAlpha = clamp((t - b0 - 1.2) / 0.5);
        ctx.fillText('SKETCHBOOK', 960, 380);
        ctx.restore();
        const t30 = s.when('三十岁', 2.4);
        note(ctx, s, '30 岁', 960, 640, t30, { size: 170, fam: T.title, col: T.red, align: 'center', stagger: 0.1 });
        const tf = s.when('第一本', 4.5);
        note(ctx, s, '人生第一本', 960, 860, tf, { size: 64, col: T.ink, align: 'center', exit: clearDesk(s) });
      },
    },
    {
      id: 'circle', energy: 0.3, transition: 'cut', tail: 0.9,
      draw(ctx, s) {
        const { W, H, t } = s;
        paper(ctx, W, H);
        // three tries at a circle, each one wobbly
        const tq = s.when('一个圆', 1.0);
        [0, 1, 2].forEach((i) => {
          const pts = draw.sketchCircle(560 + i * 400, 480, 130, { seed: boil(s, 50 + i), roughness: 16 - i * 3, steps: 50 }).slice(0, 44 + i * 2);
          pencil(ctx, pts, on(t, tq - 0.6 + i * 0.7, 0.6), T.ink, 6);
        });
        const tn = s.when('画不圆', 2.5);
        ctx.save();
        ctx.font = F(400, 110, T.title);
        ctx.fillStyle = T.red;
        ctx.textAlign = 'center';
        fx.charReveal(ctx, '画不圆', 960, 820, t - tn, { stagger: 0.12, dur: 0.3, rise: 0.12, align: 'center', exit: clearDesk(s) });
        ctx.restore();
      },
    },
    {
      id: 'promise', energy: 0.4, tail: 0.6,
      draw(ctx, s) {
        const { W, H, t } = s;
        paper(ctx, W, H);
        const t100 = s.when('一百天', 0.8);
        ctx.save();
        ctx.font = F(400, 260, T.title);
        ctx.fillStyle = T.red;
        ctx.textAlign = 'center';
        const n = Math.round(fx.countUp(ease.outCubic(clamp((t - t100) / 0.9)), 1, 100).replace(/,/g, ''));
        ctx.globalAlpha = clamp((t - t100) / 0.2);
        ctx.fillText(String(n), 760, 520);
        ctx.font = F(400, 120, T.title);
        ctx.fillText('天', 1040, 520);
        ctx.restore();
        // a speech bubble with a tiny drawing inside: words become pictures
        const tb = s.when('心里话', 2.4);
        bubble(ctx, s, 3, 1180, 250, 440, 300, on(t, tb - 0.5, 0.8), { tailTo: [1260, 600] });
        const hp = on(t, tb + 0.2, 0.7);
        const heart = [];
        for (let i = 0; i <= 40; i++) { const a = (i / 40) * Math.PI * 2; heart.push([1400 + 16 * Math.sin(a) ** 3 * 5.5, 395 - (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * 5.5]); }
        wash(ctx, heart, color.rgba(T.red, 0.5), clamp((t - tb - 0.8) / 0.4));
        pencil(ctx, heart, hp, T.red, 6);
        const tl = s.when('画出来', 3.4);
        say(ctx, s, '把心里话画出来', 960, 780, { size: 110, align: 'center' });
        ctx.font = F(400, 110, T.title);
        const w = ctx.measureText('把心里话画出来').width;
        highlight(ctx, 960 - w / 2 - 10, 800, w + 20, 34, on(t, tl + 0.4, 0.5));
      },
    },

    // ===== 二 · 放下的笔 =====================================================
    {
      id: 'kid', part: 'stuck', chapter: C2, energy: 0.3,
      draw(ctx, s) {
        const { W, H, t } = s;
        paper(ctx, W, H);
        // a textbook page: printed lines, and stick people in the margin
        const b0 = s.onBeat(0);
        pencil(ctx, rect(s, 200, 360, 200, 1200, 680, 2), on(t, b0, 0.8), T.ink, 5);
        for (let i = 0; i < 9; i++) pencil(ctx, line(s, 210 + i, 700, 280 + i * 62, 1480 - (i % 3) * 90, 280 + i * 62, 1), on(t, b0 + 0.4 + i * 0.05, 0.4), color.rgba(T.pencil, 0.5), 8);

        }
        const tn = s.when('一百零三张', 3.5);
        ctx.save();
        ctx.font = F(400, 220, T.title);
        ctx.fillStyle = T.red;
        ctx.textAlign = 'left';
        ctx.globalAlpha = clamp((t - tn) / 0.2);
        ctx.fillText(fx.countUp(ease.outCubic(clamp((t - tn) / 1.0)), 0, 103), 1150, 560);
        ctx.font = F(400, 100, T.title);
        ctx.fillText('张', 1560, 560);
        ctx.restore();
        const ts = s.when('停不下来', 6.0);
        note(ctx, s, '有几天停不下来', 1160, 720, ts - 0.4, { size: 64, col: T.pencil, exit: clearDesk(s) });
      },
    },

    // ===== 五 · 三件事 ======================================================
    {
      id: 'lesson1', part: 'lessons', chapter: C5, energy: 0.55, tail: 1.2,
      draw(ctx, s) {
        const { W, H, t } = s;
        paper(ctx, W, H);
        const t1 = s.when('第一', 2.2);
        note(ctx, s, '1', 300, 520, t1 - 0.1, { size: 300, fam: T.title, col: T.red });
        const tx = s.when('画得像', 3.4);
        note(ctx, s, '画得像', 620, 420, tx - 0.2, { size: 120, fam: T.title, col: T.pencil });
        pencil(ctx, line(s, 1700, 600, 380, 1000, 400, 2), on(t, tx + 0.8, 0.4), T.red, 8);
        const tk = s.when('看懂', 5.0);
        note(ctx, s, '让人看懂', 620, 680, tk - 0.3, { size: 150, fam: T.title, col: T.ink });
        ctx.font = F(400, 150, T.title);
        const w = ctx.measureText('让人看懂').width;
        highlight(ctx, 610, 700, w + 20, 40, on(t, tk + 0.4, 0.5));
        const q = clearDesk(s);
        ctx.globalAlpha = 1 - q;
        pencil(ctx, circle(s, 1710, 1420, 560, 150, 4), on(t, tk + 0.3, 0.6), T.ink, 5);
        pencil(ctx, poly(s, 1712, [[1360, 520], [1365, 525]], 1), on(t, tk + 0.8, 0.1), T.ink, 10);
        pencil(ctx, poly(s, 1714, [[1480, 520], [1485, 525]], 1), on(t, tk + 0.85, 0.1), T.ink, 10);
        pencil(ctx, sketchCurve(s, 1716, 1350, 610, 1420, 680, 1490, 610, 20, 1), on(t, tk + 0.9, 0.3), T.ink, 6);
        ctx.globalAlpha = 1;
      },
    },
    {
      id: 'lesson2', energy: 0.55, tail: 1.2,
      draw(ctx, s) {
        const { W, H, t } = s;
        paper(ctx, W, H);
        note(ctx, s, '2', 300, 520, s.onBeat(0), { size: 300, fam: T.title, col: T.red });
        const tc = s.when('圆', 1.0), tl = s.when('线', 1.8), ta = s.when('箭头', 2.6);
        const q = clearDesk(s);
        pencil(ctx, circle(s, 1800, 720, 450, 110, 3), on(t, tc - 0.3, 0.5), T.blue, 7);
        pencil(ctx, line(s, 1810, 940, 450, 1220, 450, 2), on(t, tl - 0.2, 0.4), T.ink, 7);
        arrow(ctx, s, 1820, 1300, 520, 1560, 380, on(t, ta - 0.3, 0.5), T.green);
        ['圆', '线', '箭头'].forEach((m, i) => note(ctx, s, m, [720, 1080, 1430][i], 650, [tc, tl, ta][i], { size: 72, col: T.pencil, align: 'center', exit: q }));
        const tx = s.when('大部分想法', 4.0);
        say(ctx, s, '就能说清大部分想法', 960, 860, { size: 84, align: 'center', exit: q });
        void tx;
      },
    },
    {
      id: 'lesson3', energy: 0.55, tail: 1.2,
      draw(ctx, s) {
        const { W, H, t } = s;
        paper(ctx, W, H);
        note(ctx, s, '3', 300, 520, s.onBeat(0), { size: 300, fam: T.title, col: T.red });
        const t1 = s.when('先画出来', 0.8);
        pencil(ctx, firstCircle(s, 720, 470, 130), on(t, t1 - 0.2, 0.6), T.ink, 6);
        note(ctx, s, '先画出来', 720, 720, t1, { size: 84, fam: T.title, align: 'center' });
        const t2 = s.when('变好', 2.2);
        arrow(ctx, s, 1900, 900, 470, 1130, 470, on(t, t2 - 0.6, 0.5), T.pencil);
        pencil(ctx, circle(s, 1910, 1340, 470, 130, 1.2), on(t, t2 - 0.1, 0.6), T.blue, 6);
        note(ctx, s, '再慢慢变好', 1340, 720, t2 - 0.3, { size: 84, fam: T.title, col: T.blue, align: 'center', exit: clearDesk(s) });
      },
    },
    // music only: the three lessons, together, before the last chapter
    {
      id: 'recap', narration: false, beats: 7, energy: 0.6,
      draw(ctx, s) {
        const { W, H, t } = s;
        paper(ctx, W, H);
        const items = ['让人看懂，不必画得像', '圆、线、箭头就够了', '先画出来，再变好'];
        items.forEach((m, i) => {
          const tb = s.onBeat(i * 2);
          note(ctx, s, String(i + 1), 520, 340 + i * 190, tb, { size: 120, fam: T.title, col: T.red });
          note(ctx, s, m, 640, 330 + i * 190, tb + 0.1, { size: 84, fam: T.title, stagger: 0.04, exit: clearDesk(s) });
          check(ctx, s, 1950 + i * 5, 1500, 300 + i * 190, on(t, tb + 0.9, 0.3), 1.1);
        });
      },
    },

    // ===== 六 · 轮到你 ======================================================
    {
      id: 'you', part: 'home', chapter: C6, energy: 0.4, tail: 0.5,
      draw(ctx, s) {
        const { W, H, t } = s;
        paper(ctx, W, H);
        const b0 = s.onBeat(0);
        sketchbook(ctx, s, 2000, 520, 180, 880, 560, on(t, b0, 1.0));
        // a thought bubble with three dots: things not yet said
        const tw = s.when('很多话', 1.5);
        bubble(ctx, s, 17, 1440, 140, 400, 250, on(t, tw - 0.4, 0.7), { thought: true, tailTo: [1380, 400] });
        [0, 1, 2].forEach((i) => pencil(ctx, circle(s, 2010 + i, 1560 + i * 80, 265, 14, 1), on(t, tw + 0.3 + i * 0.2, 0.2), T.ink, 6));
      },
    },
    {
      id: 'pen', energy: 0.45, transition: 'cut', tail: 1.0,
      draw(ctx, s) {
        const { W, H, t } = s;
        paper(ctx, W, H);
        sketchbook(ctx, s, 2000, 520, 180, 880, 560, 1);
        bubble(ctx, s, 17, 1440, 140, 400, 250, 1 - clamp((t - 0.4) / 0.6), { thought: true, tailTo: [1380, 400] });
        // the pencil rises off the desk …
        const tp = s.when('一支笔', 1.0);
        const up = ease.outCubic(clamp((t - tp + 0.3) / 0.8));
        ctx.save();
        ctx.translate(lerp(1500, 1180, up), lerp(900, 560, up));
        ctx.rotate(lerp(0, -0.7, up));
        const body = rect(s, 2050, -200, -20, 380, 40, 1);
        wash(ctx, body, 'rgba(255,216,77,0.6)', 1);
        pencil(ctx, body, 1, T.ink, 5);
        pencil(ctx, poly(s, 2055, [[180, -20], [240, 0], [180, 20]], 1), 1, T.ink, 5);
        ctx.restore();
        // … and draws one line on the page
        const tt = s.when('今天画一张', 3.5);
        pencil(ctx, sketchCurve(s, 2060, 640, 520, 900, 380, 1160, 560, 40, 2), on(t, tt - 0.2, 1.2), T.red, 7);
        say(ctx, s, '不用画得好，只要今天画一张', 960, 850, { size: 80, align: 'center', exit: clearDesk(s) });
      },
    },
    {
      id: 'end', energy: 0.4, tail: 2.6, captions: 'file',
      transition: { type: 'ink', x: 0.5, y: 0.42, duration: 1.0, ease: ease.inOutSine, edgeColor: 'rgba(209,73,91,0.2)', softness: 0.05, sfx: 'swell' },
      draw(ctx, s) {
        const { W, H, t } = s;
        paper(ctx, W, H);
        // the first wobbly circle comes back, and becomes a face
        const b0 = s.onBeat(0);
        pencil(ctx, firstCircle(s, 960, 400, 190), on(t, b0, 0.8), T.ink, 7);
        const tr = s.when('认出', 2.0);
        const fp = (k) => on(t, tr - 0.4 + k * 0.2, 0.25);
        pencil(ctx, poly(s, 2100, [[900, 360], [903, 366]], 1), fp(0), T.ink, 12);
        pencil(ctx, poly(s, 2102, [[1020, 360], [1023, 366]], 1), fp(1), T.ink, 12);
        pencil(ctx, sketchCurve(s, 2104, 880, 450, 960, 530, 1040, 450, 24, 1), fp(2), T.red, 7);
        say(ctx, s, '一百天后，你会认出自己', 960, 800, { size: 96, align: 'center' });
      },
    },
  ],
});
</script>
