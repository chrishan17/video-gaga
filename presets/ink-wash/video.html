<script>
/* =============================================================================
   INK WASH — a Chinese ink painting (水墨) that paints itself on rice paper.
   Ink is the only colour, in tones from 淡墨 (pale wash) to 焦墨 (dense
   black); one cinnabar seal is the only accent. Things arrive the way ink
   does: a drop blooms into the paper, a brush stroke presses in, runs and
   lifts with dry-brush streaks (飞白), a wash soaks in pale first and darkens.
   Things leave the way ink does too: they soften and dissolve into mist.
   Type is calligraphy set in vertical columns, read right to left. Empty
   paper is part of the composition, never filler to be used up.
   Moves are slow and settle without overshoot (outCubic / inOutSine); the
   transition is a handscroll unrolling, its seam hidden in a band of mist.
   ============================================================================= */
const { ease, clamp, lerp, draw, color, rand, noise, noise2 } = CV;

// === THEME ===================================================================
const T = {
  paper: '#EEE7D7',      // 宣纸 rice paper
  mist: '#F4EFE4',       // mist and clouds: a little lighter than the paper
  ink: '#16150F',        // 墨: every grey is this colour at a lower tone
  dim: '#857D6E',        // small labels, footnotes
  seal: '#B5342A',       // 朱砂 cinnabar: the seal, and nothing else
  brush: '"Ma Shan Zheng", "Noto Serif SC", serif',   // 楷书 display
  serif: '"Noto Serif SC", serif',                    // labels and captions
};
const F = (w, px, fam) => `${w} ${px}px ${fam}`;
// tone 0..1: 0 = clean paper, 0.15 淡墨 pale wash, 0.5 中墨, 0.9 浓墨 dense
const inkAt = (tone) => color.rgba(T.ink, clamp(tone));

// === KIT: rice paper =========================================================
// 宣纸: warm paper with long fibres, faint cloudy sizing and a darker edge.
// Rendered once per size and reused every frame (a pure cache).
const paperTex = {};
function xuan(ctx, W, H) {
  const key = `${W}x${H}`;
  if (!paperTex[key]) {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.fillStyle = T.paper;
    g.fillRect(0, 0, W, H);
    const r = rand(17);
    // cloudy sizing: large, very faint blotches
    for (let i = 0; i < 26; i++) {
      const x = r() * W, y = r() * H, rr = 120 + r() * 380;
      const gr = g.createRadialGradient(x, y, 0, x, y, rr);
      gr.addColorStop(0, `rgba(150,128,90,${0.025 + r() * 0.03})`);
      gr.addColorStop(1, 'rgba(150,128,90,0)');
      g.fillStyle = gr;
      g.fillRect(x - rr, y - rr, rr * 2, rr * 2);
    }
    // long, curling fibres
    for (let i = 0; i < 900; i++) {
      g.strokeStyle = `rgba(120,100,70,${0.025 + r() * 0.045})`;
      g.lineWidth = 0.5 + r() * 0.8;
      let x = r() * W, y = r() * H, a = r() * Math.PI * 2;
      const n = 4 + Math.floor(r() * 6);
      g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < n; k++) { a += (r() - 0.5) * 0.9; x += Math.cos(a) * 7; y += Math.sin(a) * 7; g.lineTo(x, y); }
      g.stroke();
    }
    // specks
    for (let i = 0; i < 500; i++) {
      g.fillStyle = `rgba(90,75,50,${0.05 + r() * 0.1})`;
      g.fillRect(r() * W, r() * H, 1 + r() * 1.5, 1 + r() * 1.5);
    }
    const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(100,75,35,0.16)');
    g.fillStyle = v;
    g.fillRect(0, 0, W, H);
    paperTex[key] = c;
  }
  ctx.drawImage(paperTex[key], 0, 0, W, H);
}

// === KIT: brush, bloom, wash =================================================
// A brush stroke along a polyline, drawn on to fraction p of its length. The
// width follows the hand: it presses in, runs, and lifts to a point. `dry`
// (0..1) splits it into bristles that skip over the paper toward the end of
// the stroke: 飞白, dry brush. tone 0..1 as inkAt().
function brush(ctx, pts, p, o = {}) {
  const { width = 24, tone = 0.9, seed = 1, dry = 0.3, press = 0.12, lift = 0.35, bristles = 13 } = o;
  if (p <= 0 || pts.length < 2) return;
  const L = [0];
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const total = L[L.length - 1] || 1, upto = total * clamp(p);
  // resample every ~4 px up to the brush tip
  const S = [];
  for (let l = 0, i = 1; l <= upto; l += 4) {
    while (i < L.length - 1 && L[i] < l) i++;
    const k = (l - L[i - 1]) / (L[i] - L[i - 1] || 1);
    S.push([lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k), l]);
  }
  if (S.length < 2) return;
  const wAt = (l) => {
    const k = l / total;
    return width * (0.6 + 0.4 * ease.outQuad(clamp(k / press))) * (0.1 + 0.9 * Math.sqrt(clamp((1 - k) / lift))) * (1 + 0.16 * noise(l * 0.015, seed));
  };
  const nrm = S.map((q, i) => {
    const a = S[Math.max(0, i - 1)], b = S[Math.min(S.length - 1, i + 1)];
    const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1;
    return [-dy / d, dx / d];
  });
  ctx.save();
  // the wet core: a solid ribbon, narrower the drier the brush
  const core = 1 - dry * 0.7;
  ctx.fillStyle = inkAt(tone);
  ctx.beginPath();
  S.forEach((q, i) => { const w = wAt(q[2]) * core / 2; (i ? ctx.lineTo : ctx.moveTo).call(ctx, q[0] + nrm[i][0] * w, q[1] + nrm[i][1] * w); });
  for (let i = S.length - 1; i >= 0; i--) { const w = wAt(S[i][2]) * core / 2; ctx.lineTo(S[i][0] - nrm[i][0] * w, S[i][1] - nrm[i][1] * w); }
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.arc(S[0][0], S[0][1], wAt(0) * core / 2, 0, Math.PI * 2);
  ctx.fill();
  // bristles: thin lines across the width that break up where the brush runs dry
  if (dry > 0) {
    ctx.lineCap = 'round';
    ctx.strokeStyle = inkAt(tone * 0.9);
    const rb = rand(seed * 7 + 1);
    for (let j = 0; j < bristles; j++) {
      const off = (j / (bristles - 1) - 0.5) + (rb() - 0.5) * 0.04;
      ctx.lineWidth = Math.max(1, (width / bristles) * (0.8 + rb() * 1.4));
      ctx.beginPath();
      let pen = false;
      S.forEach((q, i) => {
        const k = q[2] / total;
        const skip = (0.7 * noise(q[2] * 0.009 + j * 13.7, seed + j) + 0.3 * noise(q[2] * 0.05 + j * 5.1, seed + j + 40)) * 0.5 + 0.5 < dry * (0.25 + 0.95 * k) * (0.55 + Math.abs(off));
        const w = wAt(q[2]);
        const x = q[0] + nrm[i][0] * off * w, y = q[1] + nrm[i][1] * off * w;
        if (skip) pen = false;
        else if (!pen) { ctx.moveTo(x, y); pen = true; }
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }
  }
  ctx.restore();
}

// A smooth path through control points (Catmull-Rom), as dense points for brush().
function curve(ctrl, n = 16) {
  const out = [];
  for (let i = 0; i < ctrl.length - 1; i++) {
    const p0 = ctrl[Math.max(0, i - 1)], p1 = ctrl[i], p2 = ctrl[i + 1], p3 = ctrl[Math.min(ctrl.length - 1, i + 2)];
    for (let k = 0; k < n; k++) {
      const t = k / n, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map((d) => 0.5 * (2 * p1[d] + (-p0[d] + p2[d]) * t + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * t2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * t3)));
    }
  }
  out.push(ctrl[ctrl.length - 1]);
  return out;
}

// An ink drop blooming into the paper: a noisy-edged blot that grows fast and
// settles, paler inside, with the darker wet edge (水渍) where pigment gathers.
function bloom(ctx, x, y, r, p, o = {}) {
  const { tone = 0.8, seed = 1, rim = 0.4, rough = 0.2, halo = 0.12 } = o;
  if (p <= 0) return;
  const R = r * (0.12 + 0.88 * ease.outCubic(clamp(p)));
  const shape = (rr) => {
    ctx.beginPath();
    for (let i = 0; i <= 120; i++) {
      const a = (i / 120) * Math.PI * 2, cx = Math.cos(a), cy = Math.sin(a);
      const n = 0.65 * noise2(cx * 1.6 + 5, cy * 1.6 + 5, seed) + 0.35 * noise2(cx * 5 + 9, cy * 5 + 9, seed + 1);
      const k = rr * (1 + rough * n);
      (i ? ctx.lineTo : ctx.moveTo).call(ctx, x + cx * k, y + cy * k);
    }
    ctx.closePath();
  };
  const a = clamp(p * 4);
  ctx.save();
  // the halo where water ran ahead of the pigment
  ctx.fillStyle = inkAt(tone * halo * a);
  shape(R * 1.16);
  ctx.fill();
  const g = ctx.createRadialGradient(x, y, 0, x, y, R * (1 + rough));
  g.addColorStop(0, inkAt(tone * 0.7 * a));
  g.addColorStop(0.62, inkAt(tone * 0.62 * a));
  g.addColorStop(0.84, inkAt(tone * (0.62 + rim * 0.4) * a));
  g.addColorStop(1, inkAt(tone * 0.25 * a));
  ctx.fillStyle = g;
  shape(R);
  ctx.fill();
  ctx.restore();
}

// A wash under an edge: ink gathers along `top` (points left to right) and
// thins out over `depth` px below it, each band following the edge's shape,
// so a ridge reads dark at its crest and fades into mist at its feet. It
// soaks in: pale first, settling to its tone. `floor` clips the bottom (for
// a ridge, its base) so the wash tapers to nothing where the edge meets it.
function wash(ctx, top, depth, p, o = {}) {
  const { tone = 0.3, floor = Infinity, bands = 24, lift = 10 } = o;
  if (p <= 0 || top.length < 2) return;
  const e = ease.outCubic(clamp(p));
  ctx.save();
  ctx.translate(0, lift * (1 - e));
  ctx.fillStyle = inkAt((tone * e * 2.2) / bands);
  for (let j = 1; j <= bands; j++) {
    const k = Math.pow(j / bands, 1.6);
    ctx.beginPath();
    top.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)));
    for (let i = top.length - 1; i >= 0; i--) ctx.lineTo(top[i][0], top[i][1] + k * Math.min(depth, Math.max(0, floor - top[i][1])));
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// A ridge line for a mountain, river bank or cloud edge: a seeded profile
// between x0 and x1 that rises to `height` above `base` near `peak` (0..1).
function ridgeLine(seed, x0, x1, base, height, peak = 0.5, step = 8) {
  const pts = [];
  for (let x = x0; x <= x1; x += step) {
    const k = (x - x0) / (x1 - x0);
    const w = k < peak ? 0.5 * (k / peak) : 0.5 + 0.5 * ((k - peak) / (1 - peak));
    const env = Math.pow(Math.sin(Math.PI * w), 1.4);
    const n = 0.78 + 0.22 * noise(x * 0.005, seed) + 0.1 * noise(x * 0.021, seed + 3) + 0.04 * noise(x * 0.08, seed + 5);
    pts.push([x, base - height * env * n]);
  }
  return pts;
}

// === KIT: mist ===============================================================
// 云雾: a soft band of mist, slightly lighter than the paper, that drifts over
// the painting and swallows what it passes. x is its centre; drive it from
// s.T (global time) and it stays continuous across cuts.
function mist(ctx, x, y, w, h, o = {}) {
  const { alpha = 0.9, seed = 1, puffs = 9 } = o;
  if (alpha <= 0) return;
  const r = rand(seed);
  ctx.save();
  for (let i = 0; i < puffs; i++) {
    const px = x + (r() - 0.5) * w, py = y + (r() - 0.5) * h * 0.5;
    const rx = w * (0.18 + r() * 0.22), ry = h * (0.35 + r() * 0.3);
    ctx.save();
    ctx.translate(px, py);
    ctx.scale(rx / ry, 1);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, ry);
    g.addColorStop(0, color.rgba(T.mist, alpha * 0.8));
    g.addColorStop(0.6, color.rgba(T.mist, alpha * 0.45));
    g.addColorStop(1, color.rgba(T.mist, 0));
    ctx.fillStyle = g;
    ctx.fillRect(-ry, -ry, ry * 2, ry * 2);
    ctx.restore();
  }
  ctx.restore();
}

// === KIT: calligraphy ========================================================
// Characters that soak into the paper: each one arrives soft and slightly
// large, then sharpens, leaving a faint bleed around the strokes. Vertical by
// default (top to bottom); exit (0..1) dissolves it back into the paper.
// Returns the layout [{ ch, x, y }] so other marks can anchor to a glyph.
function inkText(ctx, str, x, y, t, o = {}) {
  const { size = 120, font = T.brush, tone = 0.92, vertical = true, gap = 1.1, stagger = 0.22, dur = 0.8, times = null, exit = 0, bleed = 0.25 } = o;
  const chars = [...str];
  ctx.save();
  ctx.font = F(400, size, font);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let cx = x;
  const out = chars.map((ch, i) => {
    const w = ctx.measureText(ch).width;
    // in a vertical column, ，。、 sit in the upper right of their cell
    const punct = vertical && /[，。、．,.]/.test(ch);
    const pos = vertical ? { ch, x: x + (punct ? size * 0.32 : 0), y: y + size * gap * (i + 0.5) - (punct ? size * 0.32 : 0) } : { ch, x: cx + w / 2, y };
    cx += w;
    const q = clamp((t - (times ? times[i] : i * stagger)) / dur);
    if (q <= 0 || exit >= 1) return pos;
    const e = ease.outCubic(q);
    const blur = (1 - e) * size * 0.07 + exit * size * 0.12;
    ctx.filter = blur > 0.3 ? `blur(${blur.toFixed(2)}px)` : 'none';
    ctx.globalAlpha = e * (1 - ease.inCubic(exit));
    ctx.shadowColor = inkAt(tone * bleed);
    ctx.shadowBlur = size * 0.05;
    ctx.fillStyle = inkAt(tone);
    const sc = 1 + 0.05 * (1 - e) + 0.04 * exit;
    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.scale(sc, sc);
    ctx.fillText(ch, 0, 0);
    ctx.restore();
    return pos;
  });
  ctx.restore();
  return out;
}

// === KIT: seal ===============================================================
// 印章: a cinnabar seal pressed onto the paper (白文: the characters are paper
// showing through). It lands in one press, scale 1.12 → 1 with a quick
// settle, and the red multiplies into the paper fibres. 1, 2 or 4 characters
// laid out right-to-left, top-to-bottom.
function seal(ctx, str, x, y, size, p, o = {}) {
  const { seed = 3 } = o;
  if (p <= 0) return;
  const chars = [...str];
  const e = ease.outCubic(clamp(p / 0.35));
  const r = rand(seed);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1.12 - 0.12 * e, 1.12 - 0.12 * e);
  ctx.globalAlpha = clamp(p / 0.1);
  const h = size / 2;
  // a slightly irregular square
  ctx.beginPath();
  const corners = [[-h, -h], [h, -h], [h, h], [-h, h]];
  corners.forEach(([cx, cy], i) => {
    const [nx, ny] = corners[(i + 1) % 4];
    for (let k = 0; k < 8; k++) {
      const q = k / 8, jx = (r() - 0.5) * size * 0.025, jy = (r() - 0.5) * size * 0.025;
      ctx[i || k ? 'lineTo' : 'moveTo'](lerp(cx, nx, q) + jx, lerp(cy, ny, q) + jy);
    }
  });
  ctx.closePath();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = T.seal;
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  // the characters, carved: paper colour
  ctx.fillStyle = T.paper;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (chars.length === 2) {
    // two tall characters side by side, the first on the right
    ctx.font = F(400, size * 0.42, T.brush);
    chars.forEach((ch, i) => {
      ctx.save(); ctx.translate((0.5 - i) * size * 0.44, size * 0.02); ctx.scale(1, 1.75); ctx.fillText(ch, 0, 0); ctx.restore();
    });
  } else {
    const n = chars.length > 2 ? 2 : 1, cell = (size * 0.84) / n;
    ctx.font = F(400, cell * 0.92, T.brush);
    chars.forEach((ch, i) => {
      // right column first, top to bottom
      const cx = n === 1 ? 0 : (0.5 - Math.floor(i / 2)) * cell, cy = n === 1 ? 0 : ((i % 2) - 0.5) * cell;
      ctx.fillText(ch, cx, cy);
    });
  }
  // wear: specks where the paste didn't take, and a few where it spilled
  for (let i = 0; i < 70; i++) {
    const sx = (r() - 0.5) * size, sy = (r() - 0.5) * size, sr = 0.6 + r() * size * 0.012;
    ctx.fillStyle = i % 5 ? color.rgba(T.paper, 0.85) : color.rgba(T.seal, 0.7);
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// === KIT: handscroll transition ==============================================
// 手卷: the next scene is the next stretch of the same scroll. The painting
// pans left as the scroll unrolls, and a band of mist hides the join.
function scrollPan(ctx, A, B, p) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const x = Math.round(p * W);
  ctx.drawImage(A, -x, 0);
  ctx.drawImage(B, W - x, 0);
  mist(ctx, W - x, H / 2, W * 0.22, H * 1.3, { seed: 5, puffs: 11, alpha: 0.9 * Math.sin(Math.PI * p) });
}

// === EXAMPLE: the landscape ==================================================
// The example's one painting, three ridges in the left third of the sheet
// (远山淡, 近山浓: far hills pale, near hills dense). `tm` holds the local time
// each ridge starts, so later scenes can draw it already finished.
const RIDGES = [
  { top: ridgeLine(11, -60, 1120, 800, 360, 0.55), base: 800, depth: 300, tone: 0.2, contour: 0.24, width: 5, dry: 0.5, seed: 11 },
  { top: ridgeLine(12, -80, 900, 890, 300, 0.32), base: 890, depth: 260, tone: 0.42, contour: 0.5, width: 8, dry: 0.45, seed: 12 },
  { top: ridgeLine(13, -100, 700, 1010, 290, 0.42), base: 1010, depth: 240, tone: 0.8, contour: 0.92, width: 14, dry: 0.4, seed: 13 },
];
function landscape(ctx, s, tm) {
  RIDGES.forEach((R, i) => {
    const t0 = tm[i];
    wash(ctx, R.top, R.depth, (s.t - t0 - 0.3) / 1.8, { tone: R.tone, floor: R.base });
    brush(ctx, R.top, ease.inOutSine(clamp((s.t - t0) / 1.4)), { width: R.width, tone: R.contour, seed: R.seed, dry: R.dry, press: 0.05, lift: 0.2 });
  });
}
// A boat in a few strokes: hull, the boatman, his pole.
function boat(ctx, s, x, y, t0) {
  const q = (d, len) => ease.inOutSine(clamp((s.t - t0 - d) / len));
  brush(ctx, curve([[x - 70, y - 6], [x - 20, y + 8], [x + 40, y + 6], [x + 78, y - 10]], 10), q(0, 0.6), { width: 11, tone: 0.85, seed: 41, dry: 0.2, press: 0.2, lift: 0.4 });
  brush(ctx, curve([[x + 6, y - 2], [x + 4, y - 26], [x + 8, y - 44]], 8), q(0.5, 0.35), { width: 10, tone: 0.85, seed: 42, dry: 0.1 });
  bloom(ctx, x + 9, y - 52, 9, q(0.75, 0.3), { tone: 0.85, seed: 43, rough: 0.1, halo: 0.05 });
  brush(ctx, curve([[x + 34, y - 64], [x - 20, y + 30]], 8), q(0.9, 0.4), { width: 4, tone: 0.75, seed: 44, dry: 0.3 });
}
// Ripples: two short pale strokes.
function ripples(ctx, s, x, y, t0) {
  [[0, 0, 140], [60, 26, 90], [-40, 46, 60]].forEach(([dx, dy, w], i) => {
    brush(ctx, curve([[x + dx - w / 2, y + dy], [x + dx, y + dy - 3], [x + dx + w / 2, y + dy + 1]], 8), ease.inOutSine(clamp((s.t - t0 - i * 0.25) / 0.6)), { width: 5, tone: 0.4, seed: 50 + i, dry: 0.5 });
  });
}

// === VIDEO ===================================================================
const unroll = { type: scrollPan, duration: 1.6, ease: ease.inOutSine, sfx: 'paper' };
// the mist that drifts across the whole film: global time keeps it continuous across cuts
const drift = (s, speed, from) => from + s.T * speed;

CV.create({
  width: 1920, height: 1080, fps: 30,
  background: T.paper,
  lang: 'zh-CN',
  // the score designed for this video: still, spacious, unhurried: a plucked zither line over a soft drone, a heartbeat only in the breath
  music: {
    bpm: 76, seed: 21, key: 'D', mode: 'major', progression: [0, 5, 3, 4], chordBars: 2,
    layers: [
      { name: 'drone', inst: 'sinepad', notes: 'chord', pattern: 'X---', vel: 0.06, attack: 1.6, release: 2 },
      { name: 'zither (sparse)', inst: 'pluck', notes: ['root_', 'fifth_', 2, 'fifth_'], pattern: 'X..x....X.......', gate: 4, vel: 0.13, bright: 0.3, decay: 0.998, echo: 0.3, verb: 0.35, from: 0.15, to: 0.5 },
      { name: 'zither', inst: 'pluck', notes: ['root_', 'fifth_', 1, 2, 'fifth_', 1], pattern: 'X..x..x.X...x...', gate: 4, vel: 0.13, bright: 0.3, decay: 0.998, echo: 0.3, verb: 0.35, from: 0.5 },
      { name: 'low string', inst: 'bass', octave: -1, notes: ['root'], pattern: 'X---', bars: 2, vel: 0.14, from: 0.4 },
      { name: 'heartbeat', inst: 'tom', pitch: 62, pattern: 'X..x............', vel: 0.22, from: 0.6 },
    ],
    lead: { inst: 'pluck', range: [69, 86], rhythm: 'sparse', vel: 0.1, echo: 0.35, verb: 0.4, bright: 0.35 },
  },
  transition: unroll,
  scenes: [
    // --- 1. A drop of ink blooms; the title soaks in beside it -------------------
    {
      id: 'title', beats: 9, energy: 0.2,
      draw(ctx, s) {
        const { W, H, t } = s;
        xuan(ctx, W, H);
        const b = (i) => s.onBeat(i);
        bloom(ctx, 760, 600, 360, (t - b(1)) / 3.2, { tone: 0.16, seed: 4, rough: 0.24, rim: 0.6 });
        bloom(ctx, 620, 470, 200, (t - b(0)) / 2.4, { tone: 0.82, seed: 2, rough: 0.2, rim: 0.45 });
        brush(ctx, curve([[300, 800], [560, 770], [860, 790], [1080, 752]]), ease.inOutSine(clamp((t - b(2.5)) / 0.9)), { width: 46, tone: 0.86, seed: 5, dry: 0.6, press: 0.08, lift: 0.4 });
        inkText(ctx, '留白', 1380, 250, t - b(4), { size: 230, stagger: s.beatLen, dur: 1.1 });
        inkText(ctx, '最难画的，是不画的地方', 1580, 270, t - b(6), { size: 38, font: T.serif, tone: 0.62, stagger: 0.06, dur: 0.6, gap: 1.18, bleed: 0 });
      },
    },
    // --- 2. Three ridges, only in the left third ---------------------------------
    {
      id: 'mountain', beats: 10, energy: 0.35,
      draw(ctx, s) {
        const { W, H, t } = s;
        xuan(ctx, W, H);
        const b = (i) => s.onBeat(i);
        landscape(ctx, s, [b(1), b(2), b(3)]);
        mist(ctx, drift(s, 22, -60), 880, 900, 160, { seed: 7, alpha: 0.85 * s.at(b(2), 2.5) });
        const q = s.out(0.9, ease.inOutSine, 0);
        inkText(ctx, '一座山', 1640, 230, t - b(5), { size: 120, stagger: 0.3, exit: q });
        inkText(ctx, '只画三分', 1470, 230, t - b(6.5), { size: 120, stagger: 0.3, exit: q });
      },
    },
    // --- 3. The other seven parts: cloud, water ----------------------------------
    {
      id: 'seven', beats: 10, energy: 0.45, transition: 'cut',
      draw(ctx, s) {
        const { W, H, t } = s;
        xuan(ctx, W, H);
        const b = (i) => s.onBeat(i);
        landscape(ctx, s, [-99, -99, -99]);
        mist(ctx, drift(s, 22, -60), 880, 900, 160, { seed: 7, alpha: 0.85 });
        inkText(ctx, '余下七分', 1640, 230, t - b(0.5), { size: 120, stagger: 0.3 });
        // 云: a wisp drifts in first, the word settles inside it
        mist(ctx, lerp(1500, 1180, ease.outCubic(clamp((t - b(2)) / 3))), 330, 640, 200, { seed: 9, alpha: 0.9 * clamp((t - b(2)) / 1.2) });
        inkText(ctx, '云', 1160, 250, t - b(3), { size: 150, tone: 0.42, dur: 1.2, bleed: 0.15 });
        boat(ctx, s, 1150, 820, b(5));
        ripples(ctx, s, 1160, 860, b(6));
        inkText(ctx, '水', 1420, 690, t - b(6.5), { size: 150, tone: 0.42, dur: 1.2, bleed: 0.15 });
      },
    },
    // --- 4. Music only: the mist takes back the words ----------------------------
    {
      id: 'breath', beats: 8, energy: 0.65, transition: 'cut',
      draw(ctx, s) {
        const { W, H, t } = s;
        xuan(ctx, W, H);
        const b = (i) => s.onBeat(i);
        const push = ease.inOutSine(clamp(t / s.dur));
        draw.camera(ctx, W, H, { zoom: 1 + 0.05 * push, focusX: lerp(W / 2, 1040, push), focusY: lerp(H / 2, 700, push) }, () => {
          landscape(ctx, s, [-99, -99, -99]);
          mist(ctx, drift(s, 22, -60), 880, 900, 160, { seed: 7, alpha: 0.85 });
          const gone = (i) => ease.inOutSine(clamp((t - b(i)) / 1.6));
          inkText(ctx, '余下七分', 1640, 230, 99, { size: 120, exit: gone(1.5) });
          inkText(ctx, '云', 1160, 250, 99, { size: 150, tone: 0.42, bleed: 0.15, exit: gone(0.5) });
          inkText(ctx, '水', 1420, 690, 99, { size: 150, tone: 0.42, bleed: 0.15, exit: gone(2.5) });
          ctx.save();
          ctx.translate(-40 * push, 0);
          boat(ctx, s, 1150, 820, -99);
          ctx.restore();
          ripples(ctx, s, 1160, 860, -99);
          // one long bank of mist crosses right to left, swallowing the words as it passes
          mist(ctx, lerp(2300, 900, ease.inOutSine(clamp((t - b(0)) / (b(5) - b(0))))), 420, 1500, 520, { seed: 12, puffs: 12, alpha: 0.95 });
        });
      },
    },
    // --- 5. Ending: two columns, then the seal on the beat -----------------------
    {
      id: 'end', beats: 12, energy: 0.3,
      transition: { type: 'ink', x: 0.58, y: 0.72, duration: 1.8, ease: ease.inOutSine, edgeColor: 'rgba(22,21,15,0.12)', softness: 0.1, sfx: 'swell' },
      sfx: [{ at: (s) => s.onBeat(7), type: 'click', gain: 0.9 }],
      draw(ctx, s) {
        const { W, H, t } = s;
        xuan(ctx, W, H);
        const b = (i) => s.onBeat(i);
        bloom(ctx, 1260, 760, 420, (t - b(0)) / 4, { tone: 0.08, seed: 31, rough: 0.28, rim: 0.7, halo: 0.2 });
        inkText(ctx, '空白处', 1040, 240, t - b(2), { size: 96, stagger: 0.32 });
        const col = inkText(ctx, '是看画人的想象', 890, 240, t - b(3.5), { size: 96, stagger: 0.32 });
        const last = col[col.length - 1];
        seal(ctx, '留白', 760, last.y + 6, 92, (t - b(7)) / 0.6, { seed: 8 });
      },
    },
  ],
});
</script>
