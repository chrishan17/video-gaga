<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbit One — launch teaser (canvas-video · Launch Keynote)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;800&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
</head>
<body>
<!-- Narration timings (generated by `cv tts` / `cv render` from narration.json). Optional. -->
<script src="build/narration.js"></script>
<script src="../../runtime/canvas-video.js"></script>
<script>
/* =============================================================================
   LAUNCH KEYNOTE — dark stage, one hero object, light as the storyteller.
   Motion grammar: slow camera push, masked line reveals, specular light sweeps,
   numbers that count on the word. One accent colour. Nothing bounces.
   ============================================================================= */
const { ease, clamp, lerp, fx, draw, color } = CV;

// === THEME (swap for brand) ==================================================
const T = {
  bg: '#050506',
  ink: '#F5F5F7',
  dim: '#86868B',
  accent: '#4D7CFF',      // brand accent: glows, units, highlights
  accent2: '#9BE7FF',     // highlight tint inside the sweep
  display: '"Geist", "Noto Sans SC", sans-serif',
  mono: '"Geist Mono", ui-monospace, monospace',
};
const F = (w, px) => `${w} ${px}px ${T.display}`;

// === SHARED DRAWING ==========================================================
// The hero object: a chip with a core grid that lights up in a radial wave.
function chip(ctx, cx, cy, size, wave, glow) {
  const r = size * 0.12;
  ctx.save();
  // outer glow
  ctx.shadowColor = color.rgba(T.accent, 0.55 * glow);
  ctx.shadowBlur = size * 0.35 * glow;
  const body = ctx.createLinearGradient(cx - size / 2, cy - size / 2, cx + size / 2, cy + size / 2);
  body.addColorStop(0, '#1d1f25');
  body.addColorStop(1, '#0b0c0f');
  ctx.fillStyle = body;
  draw.roundRect(ctx, cx - size / 2, cy - size / 2, size, size, r);
  ctx.fill();
  ctx.shadowBlur = 0;
  // rim light
  const rim = ctx.createLinearGradient(cx - size / 2, cy - size / 2, cx + size / 2, cy + size / 2);
  rim.addColorStop(0, color.rgba('#ffffff', 0.5));
  rim.addColorStop(0.45, color.rgba(T.accent, 0.25));
  rim.addColorStop(1, color.rgba('#ffffff', 0.08));
  ctx.strokeStyle = rim;
  ctx.lineWidth = Math.max(1.5, size * 0.006);
  ctx.stroke();
  // pins
  ctx.fillStyle = color.rgba('#9a9aa2', 0.35);
  const pins = 14, pl = size * 0.05;
  for (let i = 0; i < pins; i++) {
    const k = (i + 0.5) / pins, o = -size / 2 + size * 0.12 + k * size * 0.76;
    ctx.fillRect(cx + o - 2, cy - size / 2 - pl, 4, pl * 0.7);
    ctx.fillRect(cx + o - 2, cy + size / 2 + pl * 0.3, 4, pl * 0.7);
    ctx.fillRect(cx - size / 2 - pl, cy + o - 2, pl * 0.7, 4);
    ctx.fillRect(cx + size / 2 + pl * 0.3, cy + o - 2, pl * 0.7, 4);
  }
  // core grid: each cell lights when the wave front passes its distance
  const n = 8, pad = size * 0.16, cell = (size - pad * 2) / n, gap = cell * 0.18;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const x = cx - size / 2 + pad + i * cell, y = cy - size / 2 + pad + j * cell;
    const d = Math.hypot(i - (n - 1) / 2, j - (n - 1) / 2) / (n * 0.71);
    const on = ease.outCubic(clamp((wave - d) * 3));
    ctx.fillStyle = color.mix('#16181d', T.accent, on * (0.55 + 0.45 * ((i * 7 + j * 3) % 5) / 4));
    draw.roundRect(ctx, x + gap / 2, y + gap / 2, cell - gap, cell - gap, cell * 0.18);
    ctx.fill();
  }
  ctx.restore();
}

// Text filled with a moving specular band (p: 0→1 sweep position).
function sweepFill(ctx, x0, x1, p, base, hi) {
  const g = ctx.createLinearGradient(x0, 0, x1, 0);
  const c = clamp(p, 0, 1);
  g.addColorStop(0, base);
  g.addColorStop(clamp(c - 0.12), base);
  g.addColorStop(c, hi);
  g.addColorStop(clamp(c + 0.12), base);
  g.addColorStop(1, base);
  return g;
}

// === VIDEO ===================================================================
CV.create({
  width: 1920, height: 1080, fps: 30,
  background: T.bg,
  lang: 'en-US',
  fonts: [F(600, 80), F(800, 120), `500 40px ${T.mono}`],
  subtitles: {
    style: { font: `500 40px ${T.display}`, color: '#EDEDF0', box: 'rgba(18,18,22,0.72)', y: 0.915 },
  },
  scenes: [
    // --- 1. Hook: a question, one line of light ------------------------------
    {
      id: 'hook', minDuration: 3.6,
      draw(ctx, s) {
        const { W, H, t } = s;
        // floor glow breathing in
        const g = ctx.createRadialGradient(W / 2, H * 1.1, 0, W / 2, H * 1.1, H * 0.9);
        g.addColorStop(0, color.rgba(T.accent, 0.18 * s.at(0, 2.5, ease.gentle)));
        g.addColorStop(1, color.rgba(T.accent, 0));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        // hairline of light opens from the centre, then dims
        const lp = s.at(0.1, 1.1, ease.swift);
        ctx.fillStyle = color.rgba(T.ink, 0.8 * (1 - s.at(1.4, 1.2)));
        ctx.fillRect(W / 2 - (W * 0.32) * lp, H * 0.62, W * 0.64 * lp, 2);

        ctx.font = F(600, 84);
        ctx.textAlign = 'center';
        ctx.fillStyle = T.ink;
        fx.lineReveal(ctx, ['What if your computer'], W / 2, H * 0.44, t - 0.35, { dur: 0.8 });
        // second line lands exactly on the spoken word "think"
        const tk = s.when('think', 1.3) - 0.15;
        ctx.fillStyle = sweepFill(ctx, W * 0.25, W * 0.75, s.at(tk + 0.3, 1.4, ease.inOutCubic) * 1.3 - 0.15, T.ink, T.accent2);
        fx.lineReveal(ctx, ['could think one step ahead?'], W / 2, H * 0.44 + 104, t - tk, { dur: 0.8 });
      },
    },
    // --- 2. Reveal: the hero object ------------------------------------------
    {
      id: 'reveal', minDuration: 3.4,
      transition: { type: 'zoom', duration: 0.8, ease: ease.swift },
      draw(ctx, s) {
        const { W, H, t } = s;
        const push = lerp(0.9, 1, s.at(0, 1.4, ease.enter)) + 0.03 * s.p; // arrive, then drift
        draw.camera(ctx, W, H, { zoom: push }, () => {
          const halo = ctx.createRadialGradient(W / 2, H * 0.40, 0, W / 2, H * 0.40, H * 0.6);
          halo.addColorStop(0, color.rgba(T.accent, 0.22 * s.at(0.2, 1.2)));
          halo.addColorStop(1, color.rgba(T.accent, 0));
          ctx.fillStyle = halo;
          ctx.fillRect(0, 0, W, H);
          chip(ctx, W / 2, H * 0.40, 360, s.at(0.3, 1.6, ease.linear) * 1.25, s.at(0.2, 1.5));
        });
        const tn = s.when('Orbit', 0.9) - 0.1;
        ctx.font = F(800, 132);
        ctx.textAlign = 'center';
        ctx.letterSpacing = '-3px';
        ctx.fillStyle = sweepFill(ctx, W * 0.3, W * 0.7, s.at(tn + 0.5, 1.2, ease.inOutCubic) * 1.4 - 0.2, T.ink, '#ffffff');
        fx.charReveal(ctx, 'Orbit One', W / 2, H * 0.79, t - tn, { stagger: 0.045, dur: 0.6, blur: 14, rise: 0.25, align: 'center' });
        ctx.letterSpacing = '0px';
      },
    },
    // --- 3. Specs: three numbers, each counts on its spoken word -------------
    {
      id: 'specs', tail: 1.4,
      transition: { type: 'push', direction: 'up', duration: 0.7, ease: ease.swift },
      draw(ctx, s) {
        const { W, H, t } = s;
        // faint dot grid drifting upward (parallax depth)
        ctx.fillStyle = color.rgba(T.ink, 0.07);
        const off = (t * 14) % 48;
        for (let x = 24; x < W; x += 48) for (let y = -48 + (48 - off); y < H; y += 48) ctx.fillRect(x, y, 2, 2);

        // kicker so the push lands on something, not an empty frame
        ctx.font = `500 26px ${T.mono}`;
        ctx.textAlign = 'center';
        ctx.fillStyle = T.dim;
        ctx.letterSpacing = '6px';
        fx.lineReveal(ctx, ['ORBIT ONE — AT A GLANCE'], W / 2, H * 0.26, t - 0.25, { dur: 0.6 });
        ctx.letterSpacing = '0px';

        const cols = [
          { at: s.when('Forty', 0.6), to: 40, unit: 'TOPS', label: 'on-device AI' },
          { at: s.when('Twenty', 2.4), to: 22, unit: 'hours', label: 'battery life' },
          { at: s.when('Under', 4.2), to: 0.9, dec: 1, unit: 'kg', label: 'all-day carry', prefix: '<' },
        ];
        const cw = W / 3;
        cols.forEach((c, i) => {
          const cx = cw * i + cw / 2, lt = t - c.at + 0.1;
          const p = ease.outQuart(clamp(lt / 1.0));
          if (lt < 0) return;
          ctx.textAlign = 'center';
          ctx.globalAlpha = clamp(lt / 0.25);
          ctx.font = F(800, 168);
          ctx.letterSpacing = '-4px';
          ctx.fillStyle = T.ink;
          const num = fx.countUp(p, 0, c.to, { decimals: c.dec ?? 0 });
          ctx.fillText((c.prefix ?? '') + num, cx, H * 0.52 + (1 - p) * 30);
          ctx.letterSpacing = '0px';
          ctx.font = F(500, 44);
          ctx.fillStyle = T.accent;
          ctx.fillText(c.unit, cx, H * 0.52 + 76);
          ctx.font = `400 28px ${T.mono}`;
          ctx.fillStyle = T.dim;
          ctx.globalAlpha = clamp((lt - 0.3) / 0.4);
          ctx.fillText(c.label.toUpperCase(), cx, H * 0.52 + 132);
          ctx.globalAlpha = 1;
          // divider draws down after the column lands
          if (i > 0) {
            ctx.fillStyle = color.rgba(T.ink, 0.16);
            const dh = 300 * ease.outCubic(clamp(lt / 0.8));
            ctx.fillRect(cw * i, H * 0.5 - dh / 2, 1.5, dh);
          }
        });
      },
    },
    // --- 4. End card ------------------------------------------------------------
    {
      id: 'end', tail: 1.2,
      transition: { type: 'fade', duration: 0.7 },
      draw(ctx, s) {
        const { W, H, t } = s;
        chip(ctx, W / 2, H * 0.3, 120, 2, s.at(0, 1) * 0.7);
        ctx.textAlign = 'center';
        ctx.font = F(800, 112);
        ctx.letterSpacing = '-3px';
        ctx.fillStyle = T.ink;
        fx.lineReveal(ctx, ['Orbit One'], W / 2, H * 0.56, t - 0.2, { dur: 0.8 });
        ctx.letterSpacing = '0px';
        ctx.font = F(500, 56);
        ctx.fillStyle = T.accent;
        fx.lineReveal(ctx, ['Think ahead.'], W / 2, H * 0.56 + 92, t - s.when('Think', 1.0), { dur: 0.7 });
        ctx.font = `400 28px ${T.mono}`;
        ctx.fillStyle = T.dim;
        ctx.globalAlpha = s.at(s.voiceEnd, 0.6);
        ctx.fillText('AVAILABLE OCTOBER 14', W / 2, H * 0.78);
        ctx.globalAlpha = 1;
      },
    },
  ],
  // Persistent finishing layer: vignette + a touch of grain (keeps gradients from banding)
  overlay(ctx, g) {
    draw.vignette(ctx, g.W, g.H, 0.4);
    draw.grain(ctx, g.frame, 0.035);
  },
});
</script>
</body>
</html>
